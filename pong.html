<script>
// ==================== PONG ENGINE 100% FUNCIONAL (2025) ====================
const canvas = document.getElementById('pong');
const ctx = canvas.getContext('2d');
canvas.width = 900;
canvas.height = 540;

let ball = { x: canvas.width/2, y: canvas.height/2, vx: 0, vy: 0, r: 13, trail: [] };
let player = { y: canvas.height/2, score: 0, power: null, powerTime: 0 };
let opponent = { y: canvas.height/2, score: 0, power: null, powerTime: 0 };
let paddleHeight = 110;
let paddleWidth = 16;
let keys = {};
let gameRunning = false;

const DIFF_SETTINGS = {
  facil:   { speed: 4.4, reaction: 0.24, error: 0.18 },
  normal:  { speed: 5.8, reaction: 0.15, error: 0.10 },
  dificil: { speed: 7.6, reaction: 0.09, error: 0.05 },
  extremo: { speed: 10.2, reaction: 0.05, error: 0.02 }
};
let diff = DIFF_SETTINGS[config.diff];

// ----- COLORES Y EFECTOS SEGÚN CONFIG -----
function getPaddleColor(isPlayer) {
  const c = isPlayer ? config.color : config.colorIA;
  if (c === "galaxy") return "var(--galaxy-grad)";
  const found = [...ALL_COLORS, ...LOCKED_COLORS].find(x => x.name === c);
  return found && (ALL_COLORS.includes(found) || unlocks[c]) ? found.color : "#cccccc";
}

function getEffectColor(isPlayer) {
  const name = isPlayer ? config.effectColor : config.effectColorIA;
  const found = EFFECT_COLORS.find(x => x.name === name);
  return found ? found.color : "#8ee9ff";
}

function getSpriteEmoji(isPlayer) {
  const id = isPlayer ? config.sprite : config.spriteIA;
  const s = SPRITES.find(x => x.id === id);
  return s ? s.emoji : "Sparkles";
}

// ----- EFECTOS DE IMPACTO -----
function createImpact(x, y, isPlayer) {
  const emoji = getSpriteEmoji(isPlayer);
  const color = getEffectColor(isPlayer);
  const particles = 10 + Math.floor(Math.random() * 8);

  for (let i = 0; i < particles; i++) {
    const angle = Math.PI * 2 * i / particles + Math.random() * 0.5;
    const vel = 2.5 + Math.random() * 5;
    ball.trail.push({
      x, y,
      vx: Math.cos(angle) * vel,
      vy: Math.sin(angle) * vel,
      life: 1,
      color,
      emoji,
      size: 24 + Math.random() * 20
    });
  }
}

// ----- PODERES -----
const POWERS = [
  { name: "big",   label: "Grande",   duration: 400, emoji: "Large Blue Square" },
  { name: "small", label: "Pequeño",  duration: 360, emoji: "Large Yellow Square" },
  { name: "fast",  label: "Rápido",   duration: 500, emoji: "Lightning" },
  { name: "slow",  label: "Lento",    duration: 480, emoji: "Snail" }
];

function activateRandomPower(forOpponent = false) {
  const target = forOpponent ? opponent : player;
  const power = POWERS[Math.floor(Math.random() * POWERS.length)];
  target.power = power;
  target.powerTime = power.duration;

  const ui = forOpponent ? document.getElementById("oppPowerUI") : document.getElementById("playerPowerUI");
  ui.innerHTML = `<div class="power-badge">${power.emoji} ${power.label}</div>`;
  setTimeout(() => {
    if (target.power === power) {
      target.power = null;
      ui.innerHTML = "";
    }
  }, power.duration * 16.6);
}

// ----- REINICIAR PELOTA -----
function resetBall(toLeft = true) {
  ball.x = canvas.width / 2;
  ball.y = canvas.height / 2;
  const angle = (Math.random() - 0.5) * 0.7;
  const speed = diff.speed * (0.9 + Math.random() * 0.3);
  ball.vx = (toLeft ? -speed : speed);
  ball.vy = speed * Math.sin(angle);
  ball.trail = [];

  if (Math.random() < 0.3 && (player.score + opponent.score) > 4) {
    setTimeout(() => activateRandomPower(Math.random() < 0.5), 700);
  }
}

// ----- FIN DE PARTIDA -----
function endGame(playerWins) {
  gameRunning = false;
  const msg = playerWins ? "¡GANASTE!" : "Perdiste...";
  const color = playerWins ? "#7ce7ff" : "#ff6e6e";
  overlay.innerHTML = `<div class="panel" style="font-size:2.8rem;font-weight:800;color:${color}">${msg}</div>`;
  overlay.style.pointerEvents = "auto";
  setTimeout(() => {
    overlay.innerHTML = "";
    overlay.style.pointerEvents = "none";
  }, 4000);
}

// ----- INICIO / REINICIO -----
function startGame() {
  player.score = opponent.score = 0;
  document.getElementById("playerScore").textContent = "0";
  document.getElementById("oppScore").textContent = "0";
  document.getElementById("playerPowerUI").innerHTML = "";
  document.getElementById("oppPowerUI").innerHTML = "";
  player.power = opponent.power = null;
  overlay.innerHTML = "";
  resetBall();
  gameRunning = true;
  if (!window._pongLoop) requestAnimationFrame(gameLoop);
}

document.getElementById("restart").onclick = startGame;

// Controles
window.addEventListener("keydown", e => { if(["ArrowUp","ArrowDown","w","s"].includes(e.key)) keys[e.key] = true; });
window.addEventListener("keyup", e => { if(["ArrowUp","ArrowDown","w","s"].includes(e.key)) keys[e.key] = false; });

// ==================== BUCLE PRINCIPAL ====================
function gameLoop() {
  if (!gameRunning) return;

  // Fondo
  ctx.fillStyle = "rgba(10,21,36,0.98)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Línea central
  ctx.strokeStyle = "rgba(124,231,255,0.18)";
  ctx.lineWidth = 4;
  ctx.setLineDash([14, 16]);
  ctx.beginPath();
  ctx.moveTo(canvas.width/2, 0);
  ctx.lineTo(canvas.width/2, canvas.height);
  ctx.stroke();
  ctx.setLineDash([]);

  // Movimiento jugador
  if ((keys["ArrowUp"] || keys["w"]) && player.y > paddleHeight/2) player.y -= 9;
  if ((keys["ArrowDown"] || keys["s"]) && player.y < canvas.height - paddleHeight/2) player.y += 9;

  // IA
  const error = (Math.random() - 0.5) * canvas.height * diff.error;
  const targetY = ball.y + error;
  if (Math.abs(targetY - opponent.y) > diff.reaction * canvas.height) {
    opponent.y += (targetY - opponent.y) * 0.18;
  }
  opponent.y = Math.max(paddleHeight/2, Math.min(canvas.height - paddleHeight/2, opponent.y));

  // Aplicar poderes
  const pSize = player.power?.name === "big" ? 1.8 : player.power?.name === "small" ? 0.5 : 1;
  const oSize = opponent.power?.name === "big" ? 1.8 : opponent.power?.name === "small" ? 0.5 : 1;
  const speedMult = opponent.power?.name === "fast" ? 1.7 : opponent.power?.name === "slow" ? 0.5 : 1;

  const playerPH = paddleHeight * pSize;
  const oppPH = paddleHeight * oSize;

  // Actualizar pelota
  ball.x += ball.vx * speedMult;
  ball.y += ball.vy * speedMult;

  // Rebote techo/piso
  if (ball.y - ball.r <= 0 || ball.y + ball.r >= canvas.height) {
    ball.vy = -ball.vy;
    ball.y = ball.y - ball.r <= 0 ? ball.r : canvas.height - ball.r;
  }

  // Colisión raquetas
  if (ball.x - ball.r <= paddleWidth && Math.abs(ball.y - player.y) <= playerPH/2 && ball.vx < 0) {
    ball.vx = -ball.vx * 1.07;
    ball.vy += (ball.y - player.y) / (playerPH/2) * 7;
    createImpact(paddleWidth + 15, ball.y, true);
  }
  if (ball.x + ball.r >= canvas.width - paddleWidth && Math.abs(ball.y - opponent.y) <= oppPH/2 && ball.vx > 0) {
    ball.vx = -ball.vx * 1.07;
    ball.vy += (ball.y - opponent.y) / (oppPH/2) * 7;
    createImpact(canvas.width - paddleWidth - 15, ball.y, false);
  }

  // Puntuación + desbloqueables
  if (ball.x < -50) {
    opponent.score++;
    document.getElementById("oppScore").textContent = opponent.score;
    if (opponent.score === 11) { endGame(false); }
    else { resetBall(true); if (opponent.score >= 5 && opponent.score % 3 === 0) saveUnlock(config.diff); }
  }
  if (ball.x > canvas.width + 50) {
    player.score++;
    document.getElementById("playerScore").textContent = player.score;
    if (player.score === 11) { endGame(true); }
    else { resetBall(false); if (player.score >= 5 && player.score % 3 === 0) saveUnlock(config.diff); }
  }

  // Dibujar raquetas
  ctx.fillStyle = getPaddleColor(true);
  ctx.fillRect(12, player.y - playerPH/2, paddleWidth, playerPH);
  ctx.fillStyle = getPaddleColor(false);
  ctx.fillRect(canvas.width - 28, opponent.y - oppPH/2, paddleWidth, oppPH);

  // Partículas del trail
  ball.trail = ball.trail.filter(p => p.life > 0);
  ball.trail.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.035;
    ctx.globalAlpha = p.life;
    ctx.font = `${p.size * p.life}px system-ui`;
    ctx.fillStyle = p.color;
    ctx.fillText(p.emoji, p.x - p.size * p.life / 2, p.y + p.size * p.life / 3);
  });
  ctx.globalAlpha = 1;

  // Pelota
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = "#7ce7ff";
  ctx.shadowBlur = 20;
  ctx.shadowColor = "#7ce7ff";
  ctx.fill();
  ctx.shadowBlur = 0;

  requestAnimationFrame(gameLoop);
}

// ===== ARRANQUE =====
document.getElementById("playBtn").onclick = () => {
  document.getElementById("mainMenu").style.display = "none";
  document.getElementById("gameScreen").style.display = "";
  startGame();
};
</script>
