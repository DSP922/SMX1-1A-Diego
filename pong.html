<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pong — Colores + Menú</title>
<style>
  body{
    margin:0;
    background:#0d0f14;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    font-family:Arial, sans-serif;
    color:white;
  }

  canvas{
    background:#111720;
    border:3px solid #4cc9f0;
  }

  #overlay{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    pointer-events:auto;
  }

  .panel{
    background:#182330;
    padding:22px;
    border-radius:12px;
    border:2px solid #4cc9f0;
    text-align:center;
    box-shadow:0 0 20px #1b5c76;
  }

  .primary{
    background:#4cc9f0;
    border:none;
    padding:10px;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
  }

  .start-btn{
    background:#00ff9d;
    border:none;
    padding:10px 20px;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
  }

  .color-btn{
    width:30px;height:30px;
    border-radius:50%;
    cursor:pointer;
    border:2px solid white;
    display:inline-block;
    margin:4px;
  }

  .selected{
    transform:scale(1.25);
    border-color:yellow !important;
  }
</style>
</head>
<body>

<canvas id="gameCanvas" width="900" height="500"></canvas>
<div id="overlay"></div>

<script>
let canvas=document.getElementById("gameCanvas");
let ctx=canvas.getContext("2d");
let overlay=document.getElementById("overlay");

let gameStarted=false;
let playerColor="cyan";
let oppColor="red";

let player={
  x:20, y:200, w:12, h:80, score:0
};
let ai={
  x:canvas.width-32, y:200, w:12, h:80, score:0
};
let ball={
  x:canvas.width/2, y:canvas.height/2,
  r:10,
  vx:5, vy:5
};

function showColorSelector(isPlayer){
  return `
    <div class="color-sel">
      <div class="color-btn" data-color="cyan" style="background:cyan;"></div>
      <div class="color-btn" data-color="red" style="background:red;"></div>
      <div class="color-btn" data-color="lime" style="background:lime;"></div>
      <div class="color-btn" data-color="orange" style="background:orange;"></div>
      <div class="color-btn" data-color="magenta" style="background:magenta;"></div>
    </div>
  `;
}

function showStartScreen(){
  gameStarted=false;

  overlay.innerHTML=`
    <div class="panel" style="min-width:280px;">
      <div style="font-size:1.4rem;font-weight:800;color:#dff8ff">Pong — Poderes</div>

      <button id="openColorMenu" class="primary" style="width:100%;margin-top:12px;">
        MENU COLORES
      </button>

      <div style="margin-top:18px;color:#bfefff">
        Pulsa INICIAR para comenzar.
      </div>

      <button id="startBtn" class="start-btn" style="margin-top:12px;">
        INICIAR
      </button>
    </div>
  `;

  document.getElementById("openColorMenu").onclick=showColorMenu;
  document.getElementById("startBtn").onclick=startGame;
}

function showColorMenu(){
  overlay.innerHTML=`
    <div class="panel" style="min-width:280px;">
      <div style="font-size:1.2rem;font-weight:800;color:#dff8ff">
        Configuración de Colores
      </div>

      <div style="margin-top:10px;font-size:1rem;">Color Jugador:</div>
      ${showColorSelector(true)}

      <div style="margin-top:10px;font-size:1rem;">Color IA:</div>
      ${showColorSelector(false)}

      <button id="backBtn" class="primary" style="margin-top:16px;">GUARDAR Y VOLVER</button>
      <button id="exitBtn" class="start-btn" style="margin-top:8px;background:#ff3b3b;">
        SALIR DEL JUEGO
      </button>
    </div>
  `;

  document.querySelectorAll(".color-sel").forEach((sel, index)=>{
    sel.onclick=e=>{
      if(e.target.classList.contains("color-btn")){
        sel.querySelectorAll(".color-btn").forEach(b=>b.classList.remove("selected"));
        e.target.classList.add("selected");

        if(index===0) playerColor=e.target.dataset.color;
        else oppColor=e.target.dataset.color;
      }
    };
  });

  document.getElementById("backBtn").onclick=showStartScreen;

  document.getElementById("exitBtn").onclick=()=>{
    overlay.innerHTML=`
      <div class="panel">
        <div style="font-size:1.3rem;">Juego cerrado</div>
        <div style="margin-top:10px;">Gracias por jugar.</div>
      </div>
    `;
  };
}

function startGame(){
  overlay.innerHTML="";
  gameStarted=true;
  resetMatch();
}

function resetMatch(){
  player.score=0;
  ai.score=0;
  ball.x=canvas.width/2;
  ball.y=canvas.height/2;
  ball.vx=5;
  ball.vy=5;
}

function update(){
  if(!gameStarted) return;

  ball.x+=ball.vx;
  ball.y+=ball.vy;

  if(ball.y<0 || ball.y>canvas.height) ball.vy*=-1;

  if(ball.x-ball.r<player.x+player.w &&
     ball.y>player.y && ball.y<player.y+player.h){
    ball.vx*=-1;
  }

  if(ball.x+ball.r>ai.x &&
     ball.y>ai.y && ball.y<ai.y+ai.h){
    ball.vx*=-1;
  }

  if(ball.x<0){
    ai.score++;
    ball.x=canvas.width/2;
  }
  if(ball.x>canvas.width){
    player.score++;
    ball.x=canvas.width/2;
  }

  ai.y += (ball.y - (ai.y+ai.h/2))*0.05;
}

document.addEventListener("mousemove",e=>{
  let rect=canvas.getBoundingClientRect();
  player.y=e.clientY-rect.top-player.h/2;
});

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = playerColor;
  ctx.fillRect(player.x, player.y, player.w, player.h);

  ctx.fillStyle = oppColor;
  ctx.fillRect(ai.x, ai.y, ai.w, ai.h);

  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle="white";
  ctx.font="24px Arial";
  ctx.fillText(player.score, canvas.width/2-40, 30);
  ctx.fillText(ai.score, canvas.width/2+20, 30);
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

showStartScreen();
loop();
</script>
</body>
</html>
