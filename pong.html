<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Pong — Poderes por impacto (Con pantalla inicial)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --bg1:#0f1720;
      --bg2:#132235;
      --accent:#7ce7ff;
      --accent-2:#8affb0;
      --panel: rgba(255,255,255,0.04);
      --glass: rgba(255,255,255,0.03);
      --galaxy-grad: linear-gradient(135deg, #ff6ec4, #7873f5, #67e8f9, #f8b500, #f7971e, #d4145a);
    }
    html,body{
      height:100%;
      margin:0;
      font-family: Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(124,201,255,0.06), transparent),
                  linear-gradient(180deg,var(--bg1),var(--bg2));
      color:#e6f7ff;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    .container{
      width: min(920px, 96vw);
      text-align:center;
    }
    /* ... (rest of original styles unchanged) ... */
    .color-sel {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center; margin-top: 10px;
    }
    .color-btn {
      width: 28px; height: 28px; border-radius: 6px; border: 2px solid #fff;
      cursor: pointer; display: inline-block; margin:2px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      transition: border 0.2s;
    }
    .color-btn.selected {
      border:3px solid #58e6fe;
      box-shadow: 0 0 0 2px #58e6fe;
    }
    .galaxy-btn {
      background: var(--galaxy-grad);
      border-image: linear-gradient(135deg,#ff6ec4,#67e8f9) 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pong — Poderes por impacto</h1>
    <div id="scorebar">
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="score">
          <div class="name">Jugador</div>
          <div id="playerScore" class="val">0</div>
        </div>
        <div class="power-ui" id="playerPowerUI" aria-live="polite"></div>
      </div>

      <div id="controls">
        <button id="restart" class="primary">Reiniciar</button>
      </div>

      <div style="display:flex;align-items:center;gap:12px;">
        <div class="power-ui" id="oppPowerUI" aria-live="polite"></div>
        <div class="score">
          <div class="name">Oponente</div>
          <div id="oppScore" class="val">0</div>
        </div>
      </div>
    </div>

    <div style="position:relative;">
      <canvas id="pong" width="900" height="540"></canvas>
      <div id="overlay" class="overlay" aria-hidden="false"></div>
    </div>

    <div class="small">Usa las flechas ↑ ↓ para mover. Gana el primero a 11 puntos. Aparecerá un poder aleatorio cada 30s; cada poder dura 10s.</div>
  </div>

  <script>
  (function(){
    const canvas = document.getElementById('pong');
    const ctx = canvas.getContext('2d', { alpha: true });
    const W = canvas.width, H = canvas.height;

    // Visual tuning
    const bgFade = 0.14;
    const netColor = 'rgba(255,255,255,0.06)';
    const glowColor = 'rgba(124,231,255,0.28)';

    // Paddles color customization
    const COLORS = [
      "white","red","blue","green","yellow","purple","orange","pink","teal","cyan","brown","black","gray","gold","silver","lime",
      "magenta","violet","navy","indigo","maroon","olive","aqua","salmon","coral","chocolate","orchid"
    ];
    let playerColor="white", oppColor="gray";
    let playerWins = 0; // persistido en sessionStorage para color galaxia

    // Paddles
    const paddleW = 14;
    const BASE_PADDLE_H = 100;
    let playerPaddleH = BASE_PADDLE_H;
    let oppPaddleH = BASE_PADDLE_H;
    let playerY = H/2 - playerPaddleH/2;
    let oppY = H/2 - oppPaddleH/2;
    const paddleRadius = 8;
    const BASE_SPEED = 420;
    let playerSpeed = BASE_SPEED * 1.05;
    let oppSpeed = BASE_SPEED * 1.05;

    // Ball
    const ballR_BASE = 9;
    let ballR = ballR_BASE;
    let ballX = W/2, ballY = H/2;
    let ballVX = 520 * (Math.random() > 0.5 ? 1 : -1);
    let ballVY = (Math.random()*280 - 140);

    // Score
    let playerScore = 0, oppScore = 0;
    const WIN_SCORE = 11;
    let gameOver = false;
    let gameStarted = false;

    // Powerups easier to pick
    let POWER_RADIUS = 18; // aumentado
    let POWER_TTL = 17;    // +5 segundos (antes 12)
    const POWER_SPAWN_INTERVAL = 30;
    const POWER_DURATION = 10;
    let spawnAccumulator = 0;
    let activePowers = { player: null, opp: null };
    let currentFieldPower = null;

    // last paddle that touched the ball
    let lastTouched = null;

    // Potencia power config
    let powerBoost = { player: false, opp: false }; // si potencia está activo

    const POWER_TYPES = [
      { id: 'enlarge', name: 'Hitbox +', color: '#7ee8ff', icon: '▮' },
      { id: 'speed', name: 'Vel 2x', color: '#8affb0', icon: '⚡' },
      { id: 'potencia', name: 'Potencia', color: '#ff3b3b', icon: '🔥' },
    ];

    // helpers
    function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
    function rand(min,max){ return min + Math.random()*(max-min); }

    // rounded rect extension
    CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
      if (w < 2*r) r = w/2;
      if (h < 2*r) r = h/2;
      this.beginPath();
      this.moveTo(x+r, y);
      this.arcTo(x+w, y, x+w, y+h, r);
      this.arcTo(x+w, y+h, x, y+h, r);
      this.arcTo(x, y+h, x, y, r);
      this.arcTo(x, y, x+w, y, r);
      this.closePath();
      return this;
    };

    // input
    const keys = { ArrowUp:false, ArrowDown:false };
    window.addEventListener('keydown', e=>{
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        keys[e.key] = true;
        e.preventDefault();
      }
    }, { passive:false });
    window.addEventListener('keyup', e=>{
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        keys[e.key] = false;
        e.preventDefault();
      }
    }, { passive:false });

    // restart
    document.getElementById('restart').addEventListener('click', () => {
      gameStarted = true;
      document.getElementById('overlay').innerHTML = '';
      document.getElementById('overlay').style.pointerEvents = 'none';
      resetMatch();
    });

    // start screen (inicial)
    const overlay = document.getElementById('overlay');

    // ------- Color Galaxy unlock ---------
    try {
      playerWins = parseInt(window.sessionStorage.getItem('pong_playerWins')||'0',10);
    } catch{}
    function updatePlayerWins(win){
      if(win){
        playerWins++;
        try {
          window.sessionStorage.setItem('pong_playerWins', playerWins);
        }catch{}
      }
    }

    function showColorSelector(player=true){
      // Devuelve HTML para el bloque de color
      let options = "";
      COLORS.forEach(clr=>{
        options += `<div class="color-btn" data-color="${clr}" style="background:${clr};"></div>`;
      });
      // Color galaxia si el jugador ha ganado >=5 veces vs IA
      if(playerWins >= 5){
        options += `<div class="color-btn galaxy-btn" data-color="galaxy" title="Secreto: Galaxia"></div>`;
      }
      return `<div class="color-sel">${options}</div>`;
    }

    function showStartScreen(){
      gameStarted = false;
      overlay.style.pointerEvents = 'auto';
      // Mi menú de colores en el panel
      overlay.innerHTML = `<div class="panel" style="min-width:280px;">
        <div style="font-size:1.25rem;font-weight:800;color:#dff8ff">Pong — Poderes</div>
        <div style="margin-top:4px;font-size:1.03rem;">
          <span>Color Jugador:</span>
          ${showColorSelector(true)}
          <span>Color IA:</span>
          ${showColorSelector(false)}
        </div>
        <div style="margin-top:4px;color:#bfefff">Pulsa Iniciar para comenzar</div>
        <div style="display:flex;justify-content:center;">
          <button id="startBtn" class="start-btn">INICIAR</button>
        </div>
      </div>`;
      // Color picker logic (solo tras renderizar)
      Array.from(document.querySelectorAll('.color-sel')).forEach((div,i)=>{
        div.addEventListener('click', e=>{
          const btn = e.target;
          if(btn.classList.contains('color-btn')){
            div.querySelectorAll('.color-btn').forEach(b=>b.classList.remove('selected'));
            btn.classList.add('selected');
            if(i==0){ // jugador
              playerColor = btn.dataset.color;
            }else{
              oppColor = btn.dataset.color;
            }
          }
        });
        // Por defecto seleccionados
        const defclr = i==0 ? playerColor : oppColor;
        Array.from(div.querySelectorAll('.color-btn')).forEach(b=>{
          if(b.dataset.color==defclr) b.classList.add('selected');
        });
      });
      document.getElementById('startBtn').addEventListener('click', ()=>{
        overlay.innerHTML = '';
        overlay.style.pointerEvents = 'none';
        gameStarted = true;
        resetMatch();
      });
    }

    function respawnBall(direction){
      ballR = ballR_BASE;
      ballX = W/2; ballY = H/2;
      const speed = 520;
      const angle = rand(-0.6, 0.6);
      const dir = direction || (Math.random()>0.5?1:-1);
      ballVX = dir * speed * Math.cos(angle);
      ballVY = speed * Math.sin(angle);
      lastTouched = null;
    }

    function resetBall(direction){
      respawnBall(direction);
    }

    function resetMatch(){
      playerScore = 0; oppScore = 0;
      powerBoost.player = false; powerBoost.opp = false;
      updateScoreUI();
      gameOver = false;
      spawnAccumulator = 0;
      activePowers = { player: null, opp: null };
      currentFieldPower = null;
      playerPaddleH = BASE_PADDLE_H;
      oppPaddleH = BASE_PADDLE_H;
      playerSpeed = BASE_SPEED * 1.05;
      oppSpeed = BASE_SPEED * 1.05;
      playerY = H/2 - playerPaddleH/2;
      oppY = H/2 - oppPaddleH/2;
      document.getElementById('playerPowerUI').innerHTML = '';
      document.getElementById('oppPowerUI').innerHTML = '';
      respawnBall(Math.random()>0.5?1:-1);
      lastTime = performance.now();
      if (gameStarted) requestAnimationFrame(loop);
    }

    function addParticles(x,y,color,amount=18){
      for(let i=0;i<amount;i++){
        particles.push({
          x,y,
          vx: rand(-260,260),
          vy: rand(-220,220),
          life: rand(0.4,0.9),
          age:0,
          size: rand(1.8,4.4),
          color
        });
      }
    }

    function updateParticles(dt){
      for(let i=particles.length-1;i>=0;i--){
        const p = particles[i];
        p.age += dt;
        if (p.age >= p.life){ particles.splice(i,1); continue; }
        p.vy += 420 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
    }

    function spawnPower(){
      if (gameOver) return;
      if (!gameStarted) return;
      if (currentFieldPower) return;
      const type = POWER_TYPES[Math.floor(Math.random() * POWER_TYPES.length)];
      const margin = 160;
      const x = rand(margin, W - margin);
      const y = rand(60, H - 60);
      currentFieldPower = {
        x, y, r: POWER_RADIUS,
        type: type.id,
        color: type.color,
        name: type.name,
        icon: type.icon,
        spawnedAt: performance.now()/1000,
        ttl: POWER_TTL
      };
    }

    function collectPower(power, collector){
      if (!power) return;
      collector = collector || 'player';
      activePowers[collector] = {
        type: power.type,
        startedAt: performance.now()/1000,
        expiresAt: performance.now()/1000 + POWER_DURATION
      };

      if (power.type === 'enlarge'){
        if (collector === 'player'){
          playerPaddleH = BASE_PADDLE_H * 1.5;
          playerY = clamp(playerY, 0, H - playerPaddleH);
        } else {
          oppPaddleH = BASE_PADDLE_H * 1.5;
          oppY = clamp(oppY, 0, H - oppPaddleH);
        }
      } else if (power.type === 'speed'){
        if (collector === 'player'){
          playerSpeed = (BASE_SPEED * 1.05) * 2;
        } else {
          oppSpeed = (BASE_SPEED * 1.05) * 2;
        }
      } else if(power.type === 'potencia'){
        powerBoost[collector] = true;
      }

      updatePowerUI(collector);
      addParticles(power.x, power.y, power.color, 26);
      currentFieldPower = null;
    }

    function clearActivePower(side){
      activePowers[side] = null;
      powerBoost[side] = false;
      if (side === 'player'){
        playerPaddleH = BASE_PADDLE_H;
        playerSpeed = BASE_SPEED * 1.05;
        playerY = clamp(playerY, 0, H - playerPaddleH);
      } else {
        oppPaddleH = BASE_PADDLE_H;
        oppSpeed = BASE_SPEED * 1.05;
        oppY = clamp(oppY, 0, H - oppPaddleH);
      }
      updatePowerUI(side);
    }

    function updatePowerUI(side){
      const el = side === 'player' ? document.getElementById('playerPowerUI') : document.getElementById('oppPowerUI');
      el.innerHTML = '';
      const active = activePowers[side];
      if (!active) return;
      const remaining = Math.max(0, (active.expiresAt - performance.now()/1000));
      const type = POWER_TYPES.find(p=>p.id===active.type);
      const badge = document.createElement('div');
      badge.className = 'power-badge';
      badge.style.border = `1px solid ${type.color}`;
      let extra = '';
      if(type.id === 'potencia') extra = 'Disparo +50%';
      badge.innerHTML = `<div style="font-size:0.95rem">${type.icon}</div><div style="display:flex;flex-direction:column;text-align:left;">
        <div style="font-weight:800;font-size:0.88rem">${type.name}</div>
        <div style="font-size:0.75rem;color:#ff6b6b">${extra}</div>
        <div style="font-size:0.78rem;color:#cfefff"> ${remaining.toFixed(1)}s</div>
      </div>`;
      el.appendChild(badge);
    }

    function oppAI(dt){
      const target = ballY - oppPaddleH/2;
      const diff = target - oppY;
      const maxMove = oppSpeed * dt;
      oppY += clamp(diff, -maxMove, maxMove) * 0.98;
      oppY = clamp(oppY, 0, H - oppPaddleH);
    }

    function drawBackground(){
      ctx.save();
      ctx.fillStyle = `rgba(6,12,18,${bgFade})`;
      ctx.fillRect(0,0,W,H);
      ctx.restore();

      const dashH = 18, gap = 14, x = W/2;
      ctx.save();
      ctx.strokeStyle = netColor;
      ctx.lineWidth = 3;
      ctx.beginPath();
      let y = 12;
      while (y < H-12){
        ctx.moveTo(x, y);
        ctx.lineTo(x, y + dashH);
        y += dashH + gap;
      }
      ctx.stroke();
      ctx.restore();
    }

    function drawPaddle(x,y,height,active=false,isPlayer=true){
      ctx.save();
      ctx.shadowBlur = active ? 22 : 8;
      ctx.shadowColor = glowColor;
      // Color logic
      let paddleClr = isPlayer?playerColor:oppColor;
      if(paddleClr==="galaxy"){
        let grad = ctx.createLinearGradient(x, y, x, y + height);
        grad.addColorStop(0, "#ff6ec4");
        grad.addColorStop(0.16, "#7873f5");
        grad.addColorStop(0.33, "#67e8f9");
        grad.addColorStop(0.50, "#f8b500");
        grad.addColorStop(0.66, "#f7971e");
        grad.addColorStop(1, "#d4145a");
        ctx.fillStyle = grad;
      }else{
        ctx.fillStyle = paddleClr;
      }
      ctx.roundRect(x, y, paddleW, height, paddleRadius).fill();

      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,255,255,0.03)';
      ctx.roundRect(x+2,y+2,paddleW-4,height-12, paddleRadius-2).fill();
      ctx.restore();
    }

    function drawBall(){
      ctx.save();
      ctx.shadowBlur = 28;
      ctx.shadowColor = glowColor;
      const ballGrad = ctx.createRadialGradient(ballX-3, ballY-3, 2, ballX, ballY, ballR*2); // ballR variable
      ballGrad.addColorStop(0, '#e6ffff');
      ballGrad.addColorStop(0.25, '#aef6ff');
      ballGrad.addColorStop(1, 'rgba(40,200,255,0.12)');
      ctx.fillStyle = ballGrad;
      ctx.beginPath();
      ctx.arc(ballX, ballY, ballR, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath();
      ctx.arc(ballX - ballR*0.4, ballY - ballR*0.6, ballR*0.45, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    function drawPowerOnField(power){
      if (!power) return;
      ctx.save();
      ctx.shadowBlur = 18;
      ctx.shadowColor = power.color;
      ctx.fillStyle = 'rgba(255,255,255,0.02)';
      ctx.beginPath();
      ctx.arc(power.x, power.y, power.r + 8, 0, Math.PI*2);
      ctx.fill();

      const grad = ctx.createRadialGradient(power.x-4, power.y-4, 2, power.x, power.y, power.r*2);
      grad.addColorStop(0, power.color);
      grad.addColorStop(1, 'rgba(20,40,60,0.2)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(power.x, power.y, power.r, 0, Math.PI*2);
      ctx.fill();

      ctx.fillStyle = '#042b25';
      ctx.font = '14px system-ui, Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(power.icon, power.x, power.y+1);
      ctx.restore();

      const now = performance.now()/1000;
      const elapsed = now - power.spawnedAt;
      const t = clamp(elapsed / power.ttl, 0, 1);
      ctx.save();
      ctx.strokeStyle = `rgba(255,255,255,0.08)`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(power.x, power.y, power.r + 12, -Math.PI/2, -Math.PI/2 + Math.PI*2*(1 - t));
      ctx.stroke();
      ctx.restore();
    }

    function ballLogic(dt){
      ballX += ballVX * dt;
      ballY += ballVY * dt;

      if (ballY - ballR < 0){
        ballY = ballR;
        ballVY *= -1;
      } else if (ballY + ballR > H){
        ballY = H - ballR;
        ballVY *= -1;
      }

      const playerLeft = 14, playerRight = playerLeft + paddleW;
      if (ballX - ballR < playerRight && ballX - ballR > playerLeft - 40){
        if (ballY > playerY && ballY < playerY + playerPaddleH && ballVX < 0){
          ballX = playerRight + ballR;
          const relative = (ballY - (playerY + playerPaddleH/2)) / (playerPaddleH/2);
          let baseSpeed = Math.hypot(ballVX, ballVY);
          // Si potencia activo: boost!
          if(powerBoost.player) baseSpeed *= 1.5;
          const newAngle = relative * 0.8;
          const newSpeed = clamp(baseSpeed * 1.03, 420, 920);
          ballVX = Math.abs(Math.cos(newAngle) * newSpeed);
          ballVY = Math.sin(newAngle) * newSpeed;
          addParticles(ballX - ballR - 2, ballY, '#7ee8ff', 14);
          lastTouched = 'player';
        }
      }

      const oppLeft = W - 14 - paddleW, oppRight = W - 14;
      if (ballX + ballR > oppLeft && ballX + ballR < oppRight + 40){
        if (ballY > oppY && ballY < oppY + oppPaddleH && ballVX > 0){
          ballX = oppLeft - ballR;
          const relative = (ballY - (oppY + oppPaddleH/2)) / (oppPaddleH/2);
          let baseSpeed = Math.hypot(ballVX, ballVY);
          if(powerBoost.opp) baseSpeed *= 1.5;
          const newAngle = relative * 0.8;
          const newSpeed = clamp(baseSpeed * 1.03, 420, 920);
          ballVX = -Math.abs(Math.cos(newAngle) * newSpeed);
          ballVY = Math.sin(newAngle) * newSpeed;
          addParticles(ballX + ballR + 2, ballY, '#8affb0', 14);
          lastTouched = 'opp';
        }
      }

      // ball picks up power on collision (powerups pickup radius incremented)
      if (currentFieldPower){
        const dx = ballX - currentFieldPower.x;
        const dy = ballY - currentFieldPower.y;
        const dist2 = dx*dx + dy*dy;
        const collideDist = (ballR + currentFieldPower.r) + 8; // easier pickup
        if (dist2 <= collideDist * collideDist){
          const collector = lastTouched || 'player';
          collectPower(currentFieldPower, collector);
        }
      }

      if (ballX < -40){
        oppScore += 1;
        updateScoreUI(true);
        if (oppScore >= WIN_SCORE) finishGame(false);
        else resetBall(1);
      } else if (ballX > W + 40){
        playerScore += 1;
        updateScoreUI(true);
        if (playerScore >= WIN_SCORE) finishGame(true);
        else resetBall(-1);
      }
    }

    function updateScoreUI(flash=false){
      const sp = document.getElementById('playerScore');
      const so = document.getElementById('oppScore');
      sp.textContent = playerScore;
      so.textContent = oppScore;
      if (flash){
        const el = playerScore > oppScore ? sp : so;
        el.animate([{ transform:'scale(1.2)'},{ transform:'scale(1)' }], { duration:240, easing:'cubic-bezier(.2,.9,.2,1)' });
      }
    }

    function finishGame(playerWon){
      gameOver = true;
      if(playerWon){
        updatePlayerWins(true);
      }
      const ov = document.getElementById('overlay');
      ov.innerHTML = `<div class="panel" style="min-width:220px;">
        <div style="font-size:1.15rem;font-weight:700;">${playerWon ? '¡Has ganado!' : 'Has perdido'}</div>
        <div style="margin-top:8px;color:#bfefff;">${playerWon ? 'Buen trabajo — primera a 11.' : 'Inténtalo otra vez.'}</div>
        <div style="margin-top:12px;display:flex;gap:8px;justify-content:center;">
          <button id="overlayRestart" class="primary">Jugar de nuevo</button>
        </div>
      </div>`;
      ov.style.pointerEvents = 'auto';
      ov.querySelector('#overlayRestart').addEventListener('click', ()=>{
        ov.innerHTML = '';
        ov.style.pointerEvents = 'none';
        gameStarted = true;
        resetMatch();
      });
    }

    // loop
    let particles = [];
    let lastTime = 0;

    function loop(now){
      if (!gameStarted || gameOver) return;
      const dt = Math.min(0.032, (now - lastTime)/1000);
      lastTime = now;

      spawnAccumulator += dt;
      if (spawnAccumulator >= POWER_SPAWN_INTERVAL){
        spawnAccumulator = 0;
        spawnPower();
      }

      if (currentFieldPower){
        const nowSec = performance.now()/1000;
        if (nowSec - currentFieldPower.spawnedAt >= currentFieldPower.ttl){
          currentFieldPower = null;
        }
      }

      ['player','opp'].forEach(side=>{
        const ap = activePowers[side];
        if (ap){
          const nowSec = performance.now()/1000;
          if (nowSec >= ap.expiresAt){
            clearActivePower(side);
          } else {
            updatePowerUI(side);
          }
        }
      });

      let moveDir = 0;
      if (keys.ArrowUp) moveDir -= 1;
      if (keys.ArrowDown) moveDir += 1;
      playerY += moveDir * playerSpeed * dt;
      playerY = clamp(playerY, 0, H - playerPaddleH);

      oppAI(dt);

      ballLogic(dt);

      // paddle can pick up power with increased radius
      if (currentFieldPower){
        const rectX = 14, rectY = playerY, rectW = paddleW, rectH = playerPaddleH;
        const cx = currentFieldPower.x, cy = currentFieldPower.y, r = currentFieldPower.r+10;
        const nearestX = clamp(cx, rectX, rectX + rectW);
        const nearestY = clamp(cy, rectY, rectY + rectH);
        const dx = cx - nearestX, dy = cy - nearestY;
        if (dx*dx + dy*dy <= r*r){
          collectPower(currentFieldPower, 'player');
        } else {
          const rectX2 = W - 14 - paddleW, rectY2 = oppY, rectW2 = paddleW, rectH2 = oppPaddleH;
          const nearestX2 = clamp(cx, rectX2, rectX2 + rectW2);
          const nearestY2 = clamp(cy, rectY2, rectY2 + rectH2);
          const dx2 = cx - nearestX2, dy2 = cy - nearestY2;
          if (dx2*dx2 + dy2*dy2 <= r*r){
            collectPower(currentFieldPower, 'opp');
          }
        }
      }

      updateParticles(dt);

      drawBackground();
      drawPaddle(14, playerY, playerPaddleH, moveDir!==0,true);
      drawPaddle(W - 14 - paddleW, oppY, oppPaddleH, false,false);
      drawBall();
      drawPowerOnField(currentFieldPower);

      ctx.save();
      for (const p of particles){
        const t = 1 - (p.age / p.life);
        ctx.globalAlpha = Math.max(0, t);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * t, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();

      requestAnimationFrame(loop);
    }

    // init
    updateScoreUI();
    respawnBall(Math.random()>0.5?1:-1);
    lastTime = performance.now();

    showStartScreen();

    window._pong = { resetMatch, respawnBall };

  })();
  </script>
</body>
