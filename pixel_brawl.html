<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL BRAWL - Fighting Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 4px solid #ffcc00;
            background: #000;
        }

        #gameContainer {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        // ============================================================================
        // PIXEL BRAWL - Fighting Game Engine (Complete Rewrite)
        // ============================================================================

        const GAME_WIDTH = 1280;
        const GAME_HEIGHT = 720;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;
        
        ctx.imageSmoothingEnabled = false;
        ctx.webkitImageSmoothingEnabled = false;
        ctx.mozImageSmoothingEnabled = false;
        ctx.msImageSmoothingEnabled = false;

        // ============================================================================
        // CHARACTER DEFINITIONS
        // ============================================================================

        const CHARACTERS = {
            rago: {
                name: 'RAGO',
                color: '#FF3300',
                style: 'Fire Fighter',
                special: 'Fireball'
            },
            frost: {
                name: 'FROST',
                color: '#3399FF',
                style: 'Ice Martial Artist',
                special: 'Frost Nova'
            },
            venom: {
                name: 'VENOM',
                color: '#33CC33',
                style: 'Poison Brawler',
                special: 'Toxic Cloud'
            },
            volt: {
                name: 'VOLT',
                color: '#FFFF00',
                style: 'Electric Speedster',
                special: 'Thunder Dash'
            },
            specter: {
                name: 'SPECTER',
                color: '#9933FF',
                style: 'Shadow Ninja',
                special: 'Shadow Teleport'
            },
            stone: {
                name: 'STONE',
                color: '#CCCCCC',
                style: 'Heavy Grappler',
                special: 'Earth Crush'
            },
            blaze: {
                name: 'BLAZE',
                color: '#FF6600',
                style: 'Kickboxer',
                special: 'Inferno Kick'
            },
            sakura: {
                name: 'SAKURA',
                color: '#FF69B4',
                style: 'Acrobatic Fighter',
                special: 'Sky Dance'
            },
            void: {
                name: 'VOID',
                color: '#1A1A1A',
                style: 'Dark Energy Mage',
                special: 'Void Blast'
            }
        };

        const CHARACTER_KEYS = Object.keys(CHARACTERS);

        const STAGES = [
            { name: 'Dragon Dojo', bg: 'dojo' },
            { name: 'Neon City', bg: 'neon' },
            { name: 'Volcanic Crater', bg: 'volcano' },
            { name: 'Frozen Tundra', bg: 'tundra' },
            { name: 'Ancient Ruins', bg: 'ruins' },
            { name: 'Sky Colosseum', bg: 'sky' }
        ];

        // ============================================================================
        // GAME STATE
        // ============================================================================

        let gameState = {
            screen: 'title',
            player1: {
                character: 'rago',
                wins: 0,
                // Battle state
                x: 200,
                y: 480,
                vy: 0,
                hp: 100,
                facing: 1, // 1 = right, -1 = left
                action: 'idle', // idle, walk, punch, kick, hurt, jump
                actionFrame: 0,
                isGrounded: true,
                hurtbox: { x: 0, y: 0, w: 40, h: 80 },
                hitbox: null,
                keys: { left: false, right: false, up: false, punch: false, kick: false, special: false }
            },
            player2: {
                character: 'void',
                wins: 0,
                x: 1080,
                y: 480,
                vy: 0,
                hp: 100,
                facing: -1,
                action: 'idle',
                actionFrame: 0,
                isGrounded: true,
                hurtbox: { x: 0, y: 0, w: 40, h: 80 },
                hitbox: null,
                keys: { left: false, right: false, up: false, punch: false, kick: false, special: false }
            },
            selectedStage: 0,
            selectedCharP1: 0,
            selectedCharP2: 0,
            p1Confirmed: false,
            p2Confirmed: false,
            currentRound: 1,
            frameCount: 0,
            hitstopFrames: 0,
            isPaused: false
        };

        const GROUND_Y = 480;
        const GRAVITY = 0.5;
        const MOVE_SPEED = 4;
        const JUMP_POWER = -12;

        // ============================================================================
        // INPUT HANDLING
        // ============================================================================

        const keys = {};
        
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            keys[key] = true;
            
            if (key === 'enter' && gameState.screen === 'title') {
                gameState.screen = 'characterSelect';
                gameState.frameCount = 0;
                gameState.p1Confirmed = false;
                gameState.p2Confirmed = false;
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // ============================================================================
        // DRAWING UTILITIES - ALL ELEMENTS WITH BLACK OUTLINES
        // ============================================================================

        function drawFilledRect(x, y, w, h, fillColor, strokeColor = '#000000', lineWidth = 2) {
            ctx.fillStyle = fillColor;
            ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = lineWidth;
            ctx.strokeRect(x, y, w, h);
        }

        function drawFilledCircle(x, y, r, fillColor, strokeColor = '#000000', lineWidth = 2) {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = fillColor;
            ctx.fill();
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = lineWidth;
            ctx.stroke();
        }

        function drawLine(x1, y1, x2, y2, strokeColor = '#000000', lineWidth = 2) {
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = lineWidth;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
        }

        function drawText(text, x, y, fillColor = '#FFF', size = 16) {
            ctx.fillStyle = fillColor;
            ctx.font = `${size}px 'Press Start 2P'`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, x, y);
        }

        function drawPixelatedBox(x, y, w, h, fillColor, borderColor = '#000000', borderWidth = 3) {
            drawFilledRect(x, y, w, h, fillColor, borderColor, borderWidth);
        }

        // ============================================================================
        // CHARACTER DRAWING (Pixel Art Stickmen with Black Outlines)
        // ============================================================================

        function drawCharacter(player, x, y, size = 1) {
            const char = CHARACTERS[player.character];
            const facing = player.facing;
            const action = player.action;
            const frame = player.actionFrame;
            const color = char.color;

            const headR = 8 * size;
            const torsoH = 20 * size;
            const limbW = 4 * size;
            const limbL = 12 * size;

            // Animation offsets
            let bodyBob = 0;
            let armL_offset = 0, armR_offset = 0;
            let legL_offset = 0, legR_offset = 0;
            let bodyX = 0;

            if (action === 'idle') {
                bodyBob = Math.sin(frame * 0.15) * 2;
            } else if (action === 'walk') {
                bodyBob = Math.sin(frame * 0.2) * 1.5;
                armL_offset = Math.sin(frame * 0.2) * 3;
                armR_offset = -Math.sin(frame * 0.2) * 3;
                legL_offset = Math.sin(frame * 0.2) * 4;
                legR_offset = -Math.sin(frame * 0.2) * 4;
            } else if (action === 'punch') {
                if (frame < 5) armR_offset = frame * 2; // wind-up
                else if (frame < 8) armR_offset = 10 + (frame - 5) * 4; // extend
                else armR_offset = Math.max(0, 12 - (frame - 8) * 4); // retract
            } else if (action === 'kick') {
                if (frame < 5) legR_offset = frame * 2;
                else if (frame < 8) legR_offset = 10 + (frame - 5) * 5;
                else legR_offset = Math.max(0, 15 - (frame - 8) * 5);
            } else if (action === 'hurt') {
                bodyX = -15 * facing;
            } else if (action === 'jump') {
                bodyBob = -15;
            }

            // Head
            drawFilledCircle(x + bodyX, y + bodyBob - headR, headR, color, '#000000', 2);

            // Torso
            drawFilledRect(x + bodyX - 6 * size, y + bodyBob, 12 * size, torsoH, color, '#000000', 2);

            // Left arm
            const armL_x = x + bodyX - 8 * size * facing;
            const armL_y = y + bodyBob + 4 * size;
            const armL_x2 = armL_x - (limbL + armL_offset) * facing;
            drawLine(armL_x, armL_y, armL_x2, armL_y, color, 4);

            // Right arm
            const armR_x = x + bodyX + 8 * size * facing;
            const armR_y = y + bodyBob + 4 * size;
            const armR_x2 = armR_x + (limbL + armR_offset) * facing;
            drawLine(armR_x, armR_y, armR_x2, armR_y, color, 4);

            // Left leg
            const legL_y = y + bodyBob + torsoH;
            const legL_x2 = x + bodyX - 4 * size * facing + legL_offset;
            drawLine(x + bodyX - 4 * size * facing, legL_y, legL_x2, legL_y + limbL, color, 4);

            // Right leg
            const legR_x2 = x + bodyX + 4 * size * facing + legR_offset;
            drawLine(x + bodyX + 4 * size * facing, legL_y, legR_x2, legL_y + limbL, color, 4);
        }

        // ============================================================================
        // SCREEN RENDERERS
        // ============================================================================

        function drawTitleScreen() {
            // Background
            drawFilledRect(0, 0, GAME_WIDTH, GAME_HEIGHT, '#000000');

            // Grid pattern
            for (let i = 0; i < GAME_WIDTH; i += 40) {
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, GAME_HEIGHT);
                ctx.stroke();
            }
            for (let i = 0; i < GAME_HEIGHT; i += 40) {
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(GAME_WIDTH, i);
                ctx.stroke();
            }

            // Title
            drawText('PIXEL BRAWL', GAME_WIDTH / 2, 100, '#FFD700', 48);
            drawText('FIGHTING GAME', GAME_WIDTH / 2, 200, '#FF6600', 24);

            // Blinking enter text
            if (Math.floor(gameState.frameCount / 30) % 2 === 0) {
                drawText('PRESS ENTER TO START', GAME_WIDTH / 2, GAME_HEIGHT - 150, '#00FF00', 16);
            }

            drawText('© 2026 PIXEL BRAWL STUDIOS', GAME_WIDTH / 2, GAME_HEIGHT - 50, '#666', 12);
        }

        function drawCharacterSelectScreen() {
            // Background
            drawFilledRect(0, 0, GAME_WIDTH, GAME_HEIGHT, '#0a0a0a');

            // Title
            drawText('CHARACTER SELECT', GAME_WIDTH / 2, 40, '#FFD700', 32);

            // LEFT SIDE - PLAYER 1
            const p1BorderColor = gameState.p1Confirmed ? '#00FF00' : '#FF0000';
            drawPixelatedBox(40, 80, 220, 320, '#1a1a1a', p1BorderColor, 3);
            drawText('PLAYER 1', 150, 100, '#FF0000', 16);
            const p1Char = CHARACTERS[CHARACTER_KEYS[gameState.selectedCharP1]];
            drawText(p1Char.name, 150, 200, '#FFD700', 16);
            drawCharacter({ character: CHARACTER_KEYS[gameState.selectedCharP1], action: 'idle', actionFrame: gameState.frameCount, facing: 1 }, 150, 250, 1.5);
            
            if (gameState.p1Confirmed) {
                drawText('READY!', 150, 300, '#00FF00', 12);
            }

            // CENTER - CHARACTER GRID
            const charPerRow = 5;
            const charSize = 60;
            const gridStartX = 350;
            const gridStartY = 100;

            for (let i = 0; i < CHARACTER_KEYS.length; i++) {
                const row = Math.floor(i / charPerRow);
                const col = i % charPerRow;
                const cx = gridStartX + col * (charSize + 20);
                const cy = gridStartY + row * (charSize + 20);
                const charKey = CHARACTER_KEYS[i];
                const isSelectedP1 = gameState.selectedCharP1 === i;
                const borderColor = isSelectedP1 ? '#FFD700' : '#666';
                const borderWidth = isSelectedP1 ? 3 : 2;

                drawPixelatedBox(cx, cy, charSize, charSize, '#0a0a0a', borderColor, borderWidth);
                drawCharacter({ character: charKey, action: 'idle', actionFrame: gameState.frameCount, facing: 1 }, cx + charSize / 2, cy + charSize - 10, 0.8);
            }

            // RIGHT SIDE - PLAYER 2
            const p2BorderColor = gameState.p2Confirmed ? '#00FF00' : '#0000FF';
            drawPixelatedBox(1020, 80, 220, 320, '#1a1a1a', p2BorderColor, 3);
            drawText('PLAYER 2', 1130, 100, '#0000FF', 16);
            const p2Char = CHARACTERS[CHARACTER_KEYS[gameState.selectedCharP2]];
            drawText(p2Char.name, 1130, 200, '#FFD700', 16);
            drawCharacter({ character: CHARACTER_KEYS[gameState.selectedCharP2], action: 'idle', actionFrame: gameState.frameCount, facing: -1 }, 1130, 250, 1.5);
            
            if (gameState.p2Confirmed) {
                drawText('READY!', 1130, 300, '#00FF00', 12);
            }

            // Instructions
            drawText('P1: ARROW KEYS + ENTER to confirm', GAME_WIDTH / 2, GAME_HEIGHT - 80, '#00FF00', 12);
            drawText('P2: WASD + SPACE to confirm', GAME_WIDTH / 2, GAME_HEIGHT - 40, '#00FF00', 12);
        }

        function drawStageSelectScreen() {
            drawFilledRect(0, 0, GAME_WIDTH, GAME_HEIGHT, '#0a0a0a');
            drawText('STAGE SELECT', GAME_WIDTH / 2, 40, '#FFD700', 32);

            const gridX = 100;
            const gridY = 150;
            const stageWidth = 180;
            const stageHeight = 100;
            const stagesPerRow = 3;

            for (let i = 0; i < STAGES.length; i++) {
                const row = Math.floor(i / stagesPerRow);
                const col = i % stagesPerRow;
                const x = gridX + col * (stageWidth + 60);
                const y = gridY + row * (stageHeight + 60);
                const stage = STAGES[i];
                const isSelected = gameState.selectedStage === i;
                const borderColor = isSelected ? '#00FF00' : '#FFD700';
                const borderWidth = isSelected ? 4 : 2;

                drawPixelatedBox(x, y, stageWidth, stageHeight, '#1a1a1a', borderColor, borderWidth);
                drawText(stage.name, x + stageWidth / 2, y + 30, '#FFD700', 12);
            }

            drawText('ARROW KEYS: SELECT | ENTER: START BATTLE', GAME_WIDTH / 2, GAME_HEIGHT - 40, '#00FF00', 12);
        }

        function drawBattleBackground() {
            const stage = STAGES[gameState.selectedStage];
            drawFilledRect(0, 0, GAME_WIDTH, GAME_HEIGHT, '#1a1a1a');

            if (stage.bg === 'dojo') {
                drawFilledRect(0, GROUND_Y + 40, GAME_WIDTH, GAME_HEIGHT - GROUND_Y - 40, '#8B4513', '#654321', 2);
                for (let i = 0; i < GAME_WIDTH; i += 100) {
                    drawFilledRect(i, GROUND_Y + 40, 2, GAME_HEIGHT - GROUND_Y - 40, '#654321');
                }
            } else if (stage.bg === 'neon') {
                drawFilledRect(0, 0, GAME_WIDTH, GAME_HEIGHT * 0.7, '#001a33');
                drawFilledRect(0, GAME_HEIGHT * 0.7, GAME_WIDTH, GAME_HEIGHT * 0.3, '#0a0a1a');
            } else if (stage.bg === 'volcano') {
                drawFilledRect(0, 0, GAME_WIDTH, GAME_HEIGHT * 0.5, '#330000');
                drawFilledRect(0, GAME_HEIGHT * 0.5, GAME_WIDTH, GAME_HEIGHT * 0.5, '#FF3300');
            } else if (stage.bg === 'tundra') {
                drawFilledRect(0, 0, GAME_WIDTH, GAME_HEIGHT, '#E0F4FF');
            } else if (stage.bg === 'ruins') {
                drawFilledRect(0, 0, GAME_WIDTH, GAME_HEIGHT, '#2d5016');
            } else if (stage.bg === 'sky') {
                drawFilledRect(0, 0, GAME_WIDTH, GAME_HEIGHT, '#1a3a5c');
            }

            // Ground line
            drawLine(0, GROUND_Y + 40, GAME_WIDTH, GROUND_Y + 40, '#CCCCCC', 3);
        }

        function drawBattleScreen() {
            drawBattleBackground();

            // HUD background
            drawFilledRect(0, 0, GAME_WIDTH, 70, 'rgba(0,0,0,0.8)', '#FFFF00', 2);

            // P1 Health
            const p1HPPercent = Math.max(0, gameState.player1.hp / 100);
            const p1HPColor = gameState.player1.hp > 50 ? '#00FF00' : gameState.player1.hp > 25 ? '#FFFF00' : '#FF0000';
            drawPixelatedBox(20, 10, 200, 20, '#333', '#FFF', 1);
            drawFilledRect(20, 10, 200 * p1HPPercent, 20, p1HPColor);

            // P2 Health
            const p2HPPercent = Math.max(0, gameState.player2.hp / 100);
            const p2HPColor = gameState.player2.hp > 50 ? '#00FF00' : gameState.player2.hp > 25 ? '#FFFF00' : '#FF0000';
            drawPixelatedBox(GAME_WIDTH - 220, 10, 200, 20, '#333', '#FFF', 1);
            drawFilledRect(GAME_WIDTH - 220, 10, 200 * p2HPPercent, 20, p2HPColor);

            // Round info
            drawText(`ROUND ${gameState.currentRound}`, GAME_WIDTH / 2, 25, '#FFD700', 16);

            // Characters
            drawCharacter(gameState.player1, gameState.player1.x, gameState.player1.y, 2);
            drawCharacter(gameState.player2, gameState.player2.x, gameState.player2.y, 2);

            // Fight intro
            if (gameState.frameCount < 120) {
                if (gameState.frameCount < 60) {
                    drawText('FIGHT!', GAME_WIDTH / 2, GAME_HEIGHT / 2, '#FF0000', 48);
                }
            }
        }

        function drawVictoryScreen() {
            drawFilledRect(0, 0, GAME_WIDTH, GAME_HEIGHT, '#0a0a0a');
            const winner = gameState.player1.wins > gameState.player2.wins ? 'PLAYER 1' : 'PLAYER 2';
            const winColor = gameState.player1.wins > gameState.player2.wins ? '#FF0000' : '#0000FF';

            drawText(winner, GAME_WIDTH / 2, GAME_HEIGHT / 2 - 100, winColor, 48);
            drawText('WINS!', GAME_WIDTH / 2, GAME_HEIGHT / 2, '#FFD700', 48);
            drawText(`FINAL SCORE: ${gameState.player1.wins} - ${gameState.player2.wins}`, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 100, '#FFF', 16);

            if (Math.floor(gameState.frameCount / 30) % 2 === 0) {
                drawText('PRESS ENTER FOR MAIN MENU', GAME_WIDTH / 2, GAME_HEIGHT - 80, '#00FF00', 14);
            }
        }

        // ============================================================================
        // UPDATE LOGIC
        // ============================================================================

        function updateCharacterSelectScreen() {
            // P1 selection (arrow keys) - only if not confirmed
            if (!gameState.p1Confirmed) {
                if (keys['arrowleft']) {
                    gameState.selectedCharP1 = Math.max(0, gameState.selectedCharP1 - 1);
                    keys['arrowleft'] = false;
                }
                if (keys['arrowright']) {
                    gameState.selectedCharP1 = Math.min(CHARACTER_KEYS.length - 1, gameState.selectedCharP1 + 1);
                    keys['arrowright'] = false;
                }
                if (keys['arrowup']) {
                    gameState.selectedCharP1 = Math.max(0, gameState.selectedCharP1 - 5);
                    keys['arrowup'] = false;
                }
                if (keys['arrowdown']) {
                    gameState.selectedCharP1 = Math.min(CHARACTER_KEYS.length - 1, gameState.selectedCharP1 + 5);
                    keys['arrowdown'] = false;
                }

                if (keys['enter']) {
                    gameState.p1Confirmed = true;
                    keys['enter'] = false;
                }
            }

            // P2 selection (WASD) - only if not confirmed
            if (!gameState.p2Confirmed) {
                if (keys['a']) {
                    gameState.selectedCharP2 = Math.max(0, gameState.selectedCharP2 - 1);
                    keys['a'] = false;
                }
                if (keys['d']) {
                    gameState.selectedCharP2 = Math.min(CHARACTER_KEYS.length - 1, gameState.selectedCharP2 + 1);
                    keys['d'] = false;
                }
                if (keys['w']) {
                    gameState.selectedCharP2 = Math.max(0, gameState.selectedCharP2 - 5);
                    keys['w'] = false;
                }
                if (keys['s']) {
                    gameState.selectedCharP2 = Math.min(CHARACTER_KEYS.length - 1, gameState.selectedCharP2 + 5);
                    keys['s'] = false;
                }

                if (keys[' ']) {
                    gameState.p2Confirmed = true;
                    keys[' '] = false;
                }
            }

            // Both players confirmed - proceed to stage select
            if (gameState.p1Confirmed && gameState.p2Confirmed) {
                gameState.player1.character = CHARACTER_KEYS[gameState.selectedCharP1];
                gameState.player2.character = CHARACTER_KEYS[gameState.selectedCharP2];
                gameState.screen = 'stageSelect';
                gameState.frameCount = 0;
                gameState.p1Confirmed = false;
                gameState.p2Confirmed = false;
            }
        }

        function updateStageSelectScreen() {
            if (keys['arrowleft']) {
                gameState.selectedStage = Math.max(0, gameState.selectedStage - 1);
                keys['arrowleft'] = false;
            }
            if (keys['arrowright']) {
                gameState.selectedStage = Math.min(STAGES.length - 1, gameState.selectedStage + 1);
                keys['arrowright'] = false;
            }
            if (keys['arrowup']) {
                gameState.selectedStage = Math.max(0, gameState.selectedStage - 3);
                keys['arrowup'] = false;
            }
            if (keys['arrowdown']) {
                gameState.selectedStage = Math.min(STAGES.length - 1, gameState.selectedStage + 3);
                keys['arrowdown'] = false;
            }

            if (keys['enter']) {
                gameState.screen = 'battle';
                gameState.frameCount = 0;
                gameState.currentRound = 1;
                gameState.player1.hp = 100;
                gameState.player2.hp = 100;
                gameState.player1.x = 200;
                gameState.player2.x = GAME_WIDTH - 200;
                gameState.player1.y = GROUND_Y;
                gameState.player2.y = GROUND_Y;
                gameState.player1.vy = 0;
                gameState.player2.vy = 0;
                gameState.player1.facing = 1;
                gameState.player2.facing = -1;
                gameState.player1.isGrounded = true;
                gameState.player2.isGrounded = true;
                gameState.player1.action = 'idle';
                gameState.player2.action = 'idle';
                gameState.player1.actionFrame = 0;
                gameState.player2.actionFrame = 0;
                keys['enter'] = false;
            }
        }

        function updatePlayerInput() {
            // Player 1: Arrow keys + FGHJ
            gameState.player1.keys.left = keys['arrowleft'];
            gameState.player1.keys.right = keys['arrowright'];
            gameState.player1.keys.up = keys['arrowup'];
            gameState.player1.keys.punch = keys['f'];
            gameState.player1.keys.kick = keys['g'];
            gameState.player1.keys.special = keys['h'];

            // Player 2: WASD + UIOP
            gameState.player2.keys.left = keys['a'];
            gameState.player2.keys.right = keys['d'];
            gameState.player2.keys.up = keys['w'];
            gameState.player2.keys.punch = keys['u'];
            gameState.player2.keys.kick = keys['i'];
            gameState.player2.keys.special = keys['o'];
        }

        function updatePlayer(player, opponent) {
            // Gravity
            player.vy += GRAVITY;
            player.y += player.vy;

            // Ground collision
            if (player.y >= GROUND_Y) {
                player.y = GROUND_Y;
                player.vy = 0;
                player.isGrounded = true;
            } else {
                player.isGrounded = false;
            }

            // Movement
            if (player.keys.left && player.x > 50) {
                player.x -= MOVE_SPEED;
                if (player.action === 'idle') player.action = 'walk';
                player.facing = -1;
            } else if (player.keys.right && player.x < GAME_WIDTH - 50) {
                player.x += MOVE_SPEED;
                if (player.action === 'idle') player.action = 'walk';
                player.facing = 1;
            } else if (player.action === 'walk') {
                player.action = 'idle';
                player.actionFrame = 0;
            }

            // Jump
            if (player.keys.up && player.isGrounded) {
                player.vy = JUMP_POWER;
                player.isGrounded = false;
                player.action = 'jump';
            }

            // Actions
            if (player.keys.punch && player.action === 'idle' && gameState.hitstopFrames === 0) {
                player.action = 'punch';
                player.actionFrame = 0;
            } else if (player.keys.kick && player.action === 'idle' && gameState.hitstopFrames === 0) {
                player.action = 'kick';
                player.actionFrame = 0;
            }

            // Action animation loop
            if (player.action === 'punch') {
                player.actionFrame++;
                if (player.actionFrame >= 12) {
                    player.action = 'idle';
                    player.actionFrame = 0;
                }
                // Hitbox frames 5-8
                if (player.actionFrame >= 5 && player.actionFrame <= 8) {
                    const hbX = player.x + 25 * player.facing;
                    const hbY = player.y - 10;
                    player.hitbox = { x: hbX, y: hbY, w: 20, h: 20 };
                } else {
                    player.hitbox = null;
                }
            } else if (player.action === 'kick') {
                player.actionFrame++;
                if (player.actionFrame >= 12) {
                    player.action = 'idle';
                    player.actionFrame = 0;
                }
                // Hitbox frames 5-8
                if (player.actionFrame >= 5 && player.actionFrame <= 8) {
                    const hbX = player.x + 30 * player.facing;
                    const hbY = player.y - 5;
                    player.hitbox = { x: hbX, y: hbY, w: 25, h: 15 };
                } else {
                    player.hitbox = null;
                }
            } else if (player.action === 'hurt') {
                player.actionFrame++;
                if (player.actionFrame >= 10) {
                    player.action = 'idle';
                    player.actionFrame = 0;
                }
            } else if (player.action === 'jump') {
                if (player.isGrounded) {
                    player.action = 'idle';
                    player.actionFrame = 0;
                }
            } else {
                player.actionFrame++;
                if (player.actionFrame >= 30) player.actionFrame = 0;
            }

            // Update hurtbox
            player.hurtbox = {
                x: player.x - 20,
                y: player.y - 40,
                w: 40,
                h: 80
            };
        }

        function checkAABBCollision(box1, box2) {
            return box1.x < box2.x + box2.w &&
                   box1.x + box1.w > box2.x &&
                   box1.y < box2.y + box2.h &&
                   box1.y + box1.h > box2.y;
        }

        function updateBattleScreen() {
            if (gameState.hitstopFrames > 0) {
                gameState.hitstopFrames--;
                return;
            }

            updatePlayerInput();
            updatePlayer(gameState.player1, gameState.player2);
            updatePlayer(gameState.player2, gameState.player1);

            // Collision detection
            if (gameState.player1.hitbox && checkAABBCollision(gameState.player1.hitbox, gameState.player2.hurtbox)) {
                const damage = gameState.player1.action === 'punch' ? 8 : 12;
                gameState.player2.hp = Math.max(0, gameState.player2.hp - damage);
                gameState.player2.action = 'hurt';
                gameState.player2.actionFrame = 0;
                gameState.player2.x -= 20 * gameState.player2.facing;
                gameState.hitstopFrames = 5;
            }
            if (gameState.player2.hitbox && checkAABBCollision(gameState.player2.hitbox, gameState.player1.hurtbox)) {
                const damage = gameState.player2.action === 'punch' ? 8 : 12;
                gameState.player1.hp = Math.max(0, gameState.player1.hp - damage);
                gameState.player1.action = 'hurt';
                gameState.player1.actionFrame = 0;
                gameState.player1.x -= 20 * gameState.player1.facing;
                gameState.hitstopFrames = 5;
            }

            // Win conditions
            if (gameState.player1.hp <= 0) {
                gameState.player2.wins++;
                if (gameState.player2.wins >= 2) {
                    gameState.screen = 'victory';
                } else {
                    gameState.currentRound++;
                    gameState.player1.hp = 100;
                    gameState.player2.hp = 100;
                    gameState.frameCount = 0;
                }
            } else if (gameState.player2.hp <= 0) {
                gameState.player1.wins++;
                if (gameState.player1.wins >= 2) {
                    gameState.screen = 'victory';
                } else {
                    gameState.currentRound++;
                    gameState.player1.hp = 100;
                    gameState.player2.hp = 100;
                    gameState.frameCount = 0;
                }
            }
        }

        function updateVictoryScreen() {
            if (keys['enter']) {
                gameState.screen = 'title';
                gameState.frameCount = 0;
                gameState.player1.wins = 0;
                gameState.player2.wins = 0;
                gameState.currentRound = 1;
                keys['enter'] = false;
            }
        }

        // ============================================================================
        // MAIN GAME LOOP
        // ============================================================================

        function gameLoop() {
            // Render
            if (gameState.screen === 'title') {
                drawTitleScreen();
            } else if (gameState.screen === 'characterSelect') {
                drawCharacterSelectScreen();
                updateCharacterSelectScreen();
            } else if (gameState.screen === 'stageSelect') {
                drawStageSelectScreen();
                updateStageSelectScreen();
            } else if (gameState.screen === 'battle') {
                drawBattleScreen();
                updateBattleScreen();
            } else if (gameState.screen === 'victory') {
                drawVictoryScreen();
                updateVictoryScreen();
            }

            gameState.frameCount++;
            requestAnimationFrame(gameLoop);
        }

        // ============================================================================
        // START
        // ============================================================================

        gameLoop();
    </script>
</body>
