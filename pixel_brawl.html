<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL BRAWL - Fighting Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 4px solid #ffcc00;
            background: #000;
        }

        #gameContainer {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        // ============================================================================
        // PIXEL BRAWL - Fighting Game Engine
        // ============================================================================

        const GAME_WIDTH = 1280;
        const GAME_HEIGHT = 720;
        const PIXEL_SIZE = 2;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;
        
        ctx.imageSmoothingEnabled = false;
        ctx.webkitImageSmoothingEnabled = false;
        ctx.mozImageSmoothingEnabled = false;
        ctx.msImageSmoothingEnabled = false;

        // ============================================================================
        // CHARACTER DEFINITIONS
        // ============================================================================

        const CHARACTERS = {
            rago: {
                name: 'RAGO',
                color: '#FF3333',
                style: 'Fire Fighter',
                special: 'Fireball'
            },
            frost: {
                name: 'FROST',
                color: '#3366FF',
                style: 'Ice Martial Artist',
                special: 'Frost Nova'
            },
            venom: {
                name: 'VENOM',
                color: '#33CC33',
                style: 'Poison Brawler',
                special: 'Toxic Cloud'
            },
            volt: {
                name: 'VOLT',
                color: '#FFFF00',
                style: 'Electric Speedster',
                special: 'Thunder Dash'
            },
            specter: {
                name: 'SPECTER',
                color: '#9933FF',
                style: 'Shadow Ninja',
                special: 'Shadow Teleport'
            },
            stone: {
                name: 'STONE',
                color: '#CCCCCC',
                style: 'Heavy Grappler',
                special: 'Earth Crush'
            },
            blaze: {
                name: 'BLAZE',
                color: '#FF6600',
                style: 'Kickboxer',
                special: 'Inferno Kick'
            },
            sakura: {
                name: 'SAKURA',
                color: '#FF69B4',
                style: 'Acrobatic Fighter',
                special: 'Sky Dance'
            },
            void: {
                name: 'VOID',
                color: '#1A1A1A',
                style: 'Dark Energy Mage',
                special: 'Void Blast'
            }
        };

        const CHARACTER_KEYS = Object.keys(CHARACTERS);

        const STAGES = [
            {
                name: 'Dragon Dojo',
                bg: 'dojo',
                description: 'Japanese tatami room'
            },
            {
                name: 'Neon City',
                bg: 'neon',
                description: 'Cyberpunk rooftop'
            },
            {
                name: 'Volcanic Crater',
                bg: 'volcano',
                description: 'Lava background'
            },
            {
                name: 'Frozen Tundra',
                bg: 'tundra',
                description: 'Snow mountains'
            },
            {
                name: 'Ancient Ruins',
                bg: 'ruins',
                description: 'Jungle temple'
            },
            {
                name: 'Sky Colosseum',
                bg: 'sky',
                description: 'Floating arena'
            }
        ];

        // ============================================================================
        // GAME STATE
        // ============================================================================

        let gameState = {
            screen: 'title', // title, characterSelect, stageSelect, battle, victory
            player1: {
                character: 'rago',
                costume: 0,
                wins: 0
            },
            player2: {
                character: 'void',
                costume: 0,
                wins: 0
            },
            selectedStage: 0,
            currentRound: 1,
            frameCount: 0,
            isPaused: false
        };

        // ============================================================================
        // INPUT HANDLING
        // ============================================================================

        const keys = {};
        
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            
            if (e.key === 'Enter' && gameState.screen === 'title') {
                gameState.screen = 'characterSelect';
                gameState.frameCount = 0;
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // ============================================================================
        // PIXEL ART DRAWING UTILITIES
        // ============================================================================

        function drawPixel(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x * PIXEL_SIZE, y * PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);
        }

        function drawRect(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
        }

        function drawText(text, x, y, color = '#FFF', size = 16) {
            ctx.fillStyle = color;
            ctx.font = `${size}px 'Press Start 2P'`;
            ctx.textAlign = 'center';
            ctx.fillText(text, x, y);
        }

        function drawBorder(x, y, w, h, color, thickness = 4) {
            drawRect(x, y, w, thickness, color);
            drawRect(x, y + h - thickness, w, thickness, color);
            drawRect(x, y, thickness, h, color);
            drawRect(x + w - thickness, y, thickness, h, color);
        }

        // ============================================================================
        // CHARACTER SPRITE DRAWING
        // ============================================================================

        function drawStickman(x, y, color, pose = 'idle', facing = 1, frame = 0) {
            const scale = 8;
            const baseX = x;
            const baseY = y;

            // Animate idle with slight bob
            const bob = Math.sin(frame * 0.05) * 2;

            if (pose === 'idle') {
                // Head
                drawPixel(baseX + 0 * facing, baseY + bob, color);
                drawPixel(baseX + 1 * facing, baseY + bob, color);
                
                // Body
                drawPixel(baseX + 0 * facing, baseY + 2 + bob, color);
                drawPixel(baseX + 1 * facing, baseY + 2 + bob, color);
                drawPixel(baseX + 0 * facing, baseY + 3 + bob, color);
                drawPixel(baseX + 1 * facing, baseY + 3 + bob, color);
                
                // Arms (boxing stance)
                drawPixel(baseX - 2 * facing, baseY + 2 + bob, color);
                drawPixel(baseX - 1 * facing, baseY + 2 + bob, color);
                drawPixel(baseX + 2 * facing, baseY + 2 + bob, color);
                drawPixel(baseX + 3 * facing, baseY + 2 + bob, color);
                
                // Legs
                drawPixel(baseX - 1 * facing, baseY + 4 + bob, color);
                drawPixel(baseX + 0 * facing, baseY + 4 + bob, color);
            } else if (pose === 'punch') {
                const punchExt = Math.sin(frame * 0.1) * 2;
                
                // Head
                drawPixel(baseX + 0 * facing, baseY, color);
                drawPixel(baseX + 1 * facing, baseY, color);
                
                // Body
                drawPixel(baseX + 0 * facing, baseY + 2, color);
                drawPixel(baseX + 1 * facing, baseY + 2, color);
                drawPixel(baseX + 0 * facing, baseY + 3, color);
                drawPixel(baseX + 1 * facing, baseY + 3, color);
                
                // Punch arm
                drawPixel(baseX + (3 + punchExt) * facing, baseY + 2, color);
                drawPixel(baseX + (4 + punchExt) * facing, baseY + 2, color);
                drawPixel(baseX - 2 * facing, baseY + 2, color);
                drawPixel(baseX - 1 * facing, baseY + 2, color);
                
                // Legs
                drawPixel(baseX - 1 * facing, baseY + 4, color);
                drawPixel(baseX + 0 * facing, baseY + 4, color);
            } else if (pose === 'kick') {
                const kickExt = Math.sin(frame * 0.1) * 3;
                
                // Head
                drawPixel(baseX + 0 * facing, baseY - 1, color);
                drawPixel(baseX + 1 * facing, baseY - 1, color);
                
                // Body
                drawPixel(baseX + 0 * facing, baseY + 1, color);
                drawPixel(baseX + 1 * facing, baseY + 1, color);
                
                // Kick leg
                drawPixel(baseX + (3 + kickExt) * facing, baseY + 1, color);
                drawPixel(baseX + (4 + kickExt) * facing, baseY + 1, color);
                drawPixel(baseX - 1 * facing, baseY + 3, color);
            } else if (pose === 'walk') {
                const walkBob = Math.sin(frame * 0.1) * 1.5;
                
                // Head
                drawPixel(baseX + 0 * facing, baseY + bob, color);
                drawPixel(baseX + 1 * facing, baseY + bob, color);
                
                // Body
                drawPixel(baseX + 0 * facing, baseY + 2 + bob, color);
                drawPixel(baseX + 1 * facing, baseY + 2 + bob, color);
                
                // Arms
                drawPixel(baseX - 2 * facing, baseY + 2 + walkBob, color);
                drawPixel(baseX + 2 * facing, baseY + 2 - walkBob, color);
                
                // Legs
                drawPixel(baseX - 1 * facing, baseY + 4 + walkBob * 0.5, color);
                drawPixel(baseX + 0 * facing, baseY + 4 - walkBob * 0.5, color);
            }
        }

        function drawCharacterPortrait(x, y, characterKey, scale = 3) {
            const char = CHARACTERS[characterKey];
            const baseX = x;
            const baseY = y;
            
            drawStickman(baseX, baseY, char.color, 'idle', 1, gameState.frameCount);
        }

        // ============================================================================
        // BACKGROUND DRAWING
        // ============================================================================

        function drawTitleBackground() {
            // Starfield effect
            for (let i = 0; i < 100; i++) {
                const x = (gameState.frameCount * 2 + i * 13) % GAME_WIDTH;
                const y = (i * 7) % GAME_HEIGHT;
                drawPixel(Math.floor(x / PIXEL_SIZE), Math.floor(y / PIXEL_SIZE), '#FFD700');
            }

            // Grid pattern
            for (let i = 0; i < GAME_WIDTH; i += 40) {
                drawRect(i, 0, 1, GAME_HEIGHT, '#333');
            }
            for (let i = 0; i < GAME_HEIGHT; i += 40) {
                drawRect(0, i, GAME_WIDTH, 1, '#333');
            }
        }

        function drawBattleBackground() {
            const stage = STAGES[gameState.selectedStage];
            
            drawRect(0, 0, GAME_WIDTH, GAME_HEIGHT, '#1a1a1a');

            // Stage-specific backgrounds
            if (stage.bg === 'dojo') {
                // Tatami room
                drawRect(0, GAME_HEIGHT * 0.6, GAME_WIDTH, GAME_HEIGHT * 0.4, '#8B4513');
                for (let i = 0; i < GAME_WIDTH; i += 100) {
                    drawRect(i, GAME_HEIGHT * 0.6, 2, GAME_HEIGHT * 0.4, '#654321');
                }
                // Cherry blossoms
                for (let i = 0; i < 30; i++) {
                    const x = (gameState.frameCount + i * 30) % GAME_WIDTH;
                    const y = (i * 15 + gameState.frameCount * 0.5) % GAME_HEIGHT;
                    drawRect(x, y, 3, 3, '#FFB6C1');
                }
            } else if (stage.bg === 'neon') {
                // Cyberpunk rooftop
                drawRect(0, 0, GAME_WIDTH, GAME_HEIGHT * 0.7, '#001a33');
                drawRect(0, GAME_HEIGHT * 0.7, GAME_WIDTH, GAME_HEIGHT * 0.3, '#0a0a1a');
                
                // Neon signs (simplified)
                drawRect(100, 150, 100, 20, '#00FF00');
                drawRect(400, 200, 100, 20, '#FF00FF');
                drawRect(800, 180, 100, 20, '#00FFFF');
                
                // Rain
                for (let i = 0; i < 50; i++) {
                    const x = (gameState.frameCount * 3 + i * 25) % GAME_WIDTH;
                    const y = (i * 14 + gameState.frameCount * 5) % GAME_HEIGHT;
                    drawRect(x, y, 1, 8, '#4488FF');
                }
            } else if (stage.bg === 'volcano') {
                // Lava background
                drawRect(0, 0, GAME_WIDTH, GAME_HEIGHT * 0.5, '#330000');
                drawRect(0, GAME_HEIGHT * 0.5, GAME_WIDTH, GAME_HEIGHT * 0.5, '#FF3300');
                
                // Floating rocks
                for (let i = 0; i < 5; i++) {
                    const x = 200 + i * 200 + Math.sin(gameState.frameCount * 0.02 + i) * 50;
                    const y = 100 + i * 80 + Math.cos(gameState.frameCount * 0.02 + i) * 30;
                    drawRect(x, y, 60, 40, '#444444');
                }
                
                // Fire particles
                for (let i = 0; i < 20; i++) {
                    const x = (gameState.frameCount * 2 + i * 64) % GAME_WIDTH;
                    const y = GAME_HEIGHT * 0.6 + Math.sin(gameState.frameCount * 0.05 + i) * 30;
                    drawRect(x, y, 8, 8, '#FF6600');
                }
            } else if (stage.bg === 'tundra') {
                // Snow mountains
                drawRect(0, 0, GAME_WIDTH, GAME_HEIGHT, '#E0F4FF');
                
                // Mountains
                for (let i = 0; i < 3; i++) {
                    const startX = i * 500;
                    const height = 250 + i * 50;
                    ctx.fillStyle = '#CCCCCC';
                    ctx.beginPath();
                    ctx.moveTo(startX, GAME_HEIGHT * 0.5);
                    ctx.lineTo(startX + 150, GAME_HEIGHT * 0.5 - height);
                    ctx.lineTo(startX + 300, GAME_HEIGHT * 0.5);
                    ctx.fill();
                }
                
                // Blizzard particles
                for (let i = 0; i < 80; i++) {
                    const x = (gameState.frameCount * 1.5 + i * 16) % GAME_WIDTH;
                    const y = (i * 9 + gameState.frameCount * 3) % GAME_HEIGHT;
                    drawPixel(Math.floor(x / PIXEL_SIZE), Math.floor(y / PIXEL_SIZE), '#FFFFFF');
                }
            } else if (stage.bg === 'ruins') {
                // Jungle temple
                drawRect(0, 0, GAME_WIDTH, GAME_HEIGHT, '#2d5016');
                
                // Temple pillars
                drawRect(150, 150, 80, 350, '#8B7355');
                drawRect(1050, 150, 80, 350, '#8B7355');
                
                // Vines
                for (let i = 0; i < 100; i += 20) {
                    drawRect(300 + i, 100, 2, 400, '#558B2F');
                }
                
                // Torches
                drawRect(200, 250, 20, 50, '#666');
                drawRect(1020, 250, 20, 50, '#666');
                drawRect(200, 300, 25, 8, '#FF9900');
                drawRect(1020, 300, 25, 8, '#FF9900');
            } else if (stage.bg === 'sky') {
                // Floating arena
                drawRect(0, 0, GAME_WIDTH, GAME_HEIGHT, '#1a3a5c');
                
                // Clouds
                for (let i = 0; i < 5; i++) {
                    const x = i * 300 + Math.sin(gameState.frameCount * 0.01 + i) * 50;
                    const y = 100 + i * 50;
                    drawRect(x, y, 150, 40, '#CCCCFF');
                }
                
                // Lightning
                if (gameState.frameCount % 60 < 15) {
                    drawRect(GAME_WIDTH * 0.3, 0, 3, GAME_HEIGHT * 0.4, '#FFFF00');
                    drawRect(GAME_WIDTH * 0.7, 0, 3, GAME_HEIGHT * 0.3, '#FFFF00');
                }
            }
        }

        // ============================================================================
        // SCREEN RENDERING
        // ============================================================================

        function drawTitleScreen() {
            drawTitleBackground();

            // Title
            drawText('PIXEL BRAWL', GAME_WIDTH / 2, 100, '#FFD700', 48);
            
            // Subtitle
            drawText('FIGHTING GAME', GAME_WIDTH / 2, 200, '#FF6600', 24);

            // Blinking "Press Enter" text
            if (Math.floor(gameState.frameCount / 30) % 2 === 0) {
                drawText('PRESS ENTER TO START', GAME_WIDTH / 2, GAME_HEIGHT - 150, '#00FF00', 16);
            }

            // Footer
            drawText('© 2026 PIXEL BRAWL STUDIOS', GAME_WIDTH / 2, GAME_HEIGHT - 50, '#666', 12);
        }

        function drawCharacterSelectScreen() {
            // Background
            drawRect(0, 0, GAME_WIDTH, GAME_HEIGHT, '#0a0a0a');
            
            // Title
            drawText('CHARACTER SELECT', GAME_WIDTH / 2, 40, '#FFD700', 32);

            // Player 1 side (left)
            drawBorder(50, 100, 500, 400, '#FF0000', 4);
            drawText('PLAYER 1', 150, 140, '#FF0000', 20);
            const p1Char = CHARACTERS[gameState.player1.character];
            drawText(p1Char.name, 150, 220, '#FFF', 18);
            drawText(p1Char.style, 150, 270, '#AAA', 12);
            drawCharacterPortrait(100, 350, gameState.player1.character);

            // Player 2 side (right)
            drawBorder(730, 100, 500, 400, '#0000FF', 4);
            drawText('PLAYER 2', 1130, 140, '#0000FF', 20);
            const p2Char = CHARACTERS[gameState.player2.character];
            drawText(p2Char.name, 1130, 220, '#FFF', 18);
            drawText(p2Char.style, 1130, 270, '#AAA', 12);
            drawCharacterPortrait(1050, 350, gameState.player2.character);

            // Character grid at bottom
            const gridX = 200;
            const gridY = 550;
            const charSize = 100;
            const charsPerRow = 5;

            drawText('SELECT CHARACTER - ARROW KEYS + ENTER', GAME_WIDTH / 2, gridY - 30, '#FFD700', 12);

            CHARACTER_KEYS.forEach((key, index) => {
                const row = Math.floor(index / charsPerRow);
                const col = index % charsPerRow;
                const x = gridX + col * charSize;
                const y = gridY + row * charSize;

                const char = CHARACTERS[key];
                drawBorder(x, y, charSize - 10, charSize - 10, char.color, 2);
                drawText(char.name.substring(0, 3), x + charSize / 2 - 10, y + charSize / 2, char.color, 8);
            });

            // Instructions
            drawText('PRESS ENTER WHEN READY', GAME_WIDTH / 2, GAME_HEIGHT - 30, '#00FF00', 12);
        }

        function drawStageSelectScreen() {
            // Background
            drawRect(0, 0, GAME_WIDTH, GAME_HEIGHT, '#0a0a0a');

            // Title
            drawText('STAGE SELECT', GAME_WIDTH / 2, 40, '#FFD700', 32);

            // Stage grid
            const gridX = 100;
            const gridY = 150;
            const stageWidth = 200;
            const stageHeight = 120;
            const stagesPerRow = 3;

            STAGES.forEach((stage, index) => {
                const row = Math.floor(index / stagesPerRow);
                const col = index % stagesPerRow;
                const x = gridX + col * (stageWidth + 40);
                const y = gridY + row * (stageHeight + 40);

                drawBorder(x, y, stageWidth, stageHeight, '#FFD700', 2);
                drawText(stage.name, x + stageWidth / 2, y + 30, '#FFD700', 12);
                drawText(stage.description, x + stageWidth / 2, y + 70, '#AAA', 8);

                if (gameState.selectedStage === index) {
                    drawBorder(x - 5, y - 5, stageWidth + 10, stageHeight + 10, '#00FF00', 2);
                }
            });

            // Instructions
            drawText('SELECT WITH ARROW KEYS - PRESS ENTER TO START', GAME_WIDTH / 2, GAME_HEIGHT - 30, '#00FF00', 12);
        }

        function drawBattleScreen() {
            // Background
            drawBattleBackground();

            // HUD
            drawRect(0, 0, GAME_WIDTH, 60, 'rgba(0,0,0,0.7)');

            // Player 1 health
            const p1MaxHP = 100;
            const p1Current = Math.max(0, gameState.player1.hp || p1MaxHP);
            const hpColor = p1Current > 50 ? '#00FF00' : p1Current > 25 ? '#FFFF00' : '#FF0000';
            
            drawText('P1', 30, 25, '#FF0000', 16);
            drawRect(80, 10, 200, 20, '#333');
            drawRect(80, 10, Math.max(0, 200 * p1Current / p1MaxHP), 20, hpColor);
            drawBorder(80, 10, 200, 20, '#FFF', 2);

            // Player 2 health
            const p2MaxHP = 100;
            const p2Current = Math.max(0, gameState.player2.hp || p2MaxHP);
            const hp2Color = p2Current > 50 ? '#00FF00' : p2Current > 25 ? '#FFFF00' : '#FF0000';
            
            drawText('P2', GAME_WIDTH - 30, 25, '#0000FF', 16);
            drawRect(GAME_WIDTH - 280, 10, 200, 20, '#333');
            drawRect(GAME_WIDTH - 280, 10, Math.max(0, 200 * p2Current / p2MaxHP), 20, hp2Color);
            drawBorder(GAME_WIDTH - 280, 10, 200, 20, '#FFF', 2);

            // Round info
            drawText(`ROUND ${gameState.currentRound}`, GAME_WIDTH / 2, 25, '#FFD700', 16);
            
            // Timer
            const timeLeft = Math.max(0, Math.floor((300 * 60 - (gameState.frameCount % (300 * 60))) / 60));
            drawText(`${timeLeft}s`, GAME_WIDTH / 2, 50, '#FFF', 12);

            // Win counts
            drawText(`W: ${gameState.player1.wins}`, 30, 50, '#FF6666', 10);
            drawText(`W: ${gameState.player2.wins}`, GAME_WIDTH - 30, 50, '#6666FF', 10);

            // Characters
            const p1Char = CHARACTERS[gameState.player1.character];
            const p2Char = CHARACTERS[gameState.player2.character];

            // P1 Character (left side)
            const p1X = 150;
            const p1Y = GAME_HEIGHT - 150;
            drawStickman(p1X, p1Y, p1Char.color, 'idle', 1, gameState.frameCount);

            // P2 Character (right side)
            const p2X = GAME_WIDTH - 150;
            const p2Y = GAME_HEIGHT - 150;
            drawStickman(p2X, p2Y, p2Char.color, 'idle', -1, gameState.frameCount);

            // Fight indicator
            if (gameState.frameCount < 120) {
                if (gameState.frameCount < 60) {
                    drawText('ROUND 1', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 40, '#FFD700', 32);
                } else {
                    drawText('FIGHT!', GAME_WIDTH / 2, GAME_HEIGHT / 2, '#FF0000', 40);
                }
            }
        }

        function drawVictoryScreen() {
            // Background with confetti effect
            drawRect(0, 0, GAME_WIDTH, GAME_HEIGHT, '#0a0a0a');

            // Confetti
            for (let i = 0; i < 100; i++) {
                const x = Math.sin(gameState.frameCount * 0.05 + i) * GAME_WIDTH;
                const y = (gameState.frameCount * 2 + i * 7) % GAME_HEIGHT;
                const colors = ['#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#FF00FF'];
                drawRect(x, y, 6, 6, colors[i % colors.length]);
            }

            // Winner text
            const winner = gameState.player1.wins > gameState.player2.wins ? 'PLAYER 1' : 'PLAYER 2';
            const winColor = gameState.player1.wins > gameState.player2.wins ? '#FF0000' : '#0000FF';

            drawText(winner, GAME_WIDTH / 2, GAME_HEIGHT / 2 - 100, winColor, 48);
            drawText('WINS!', GAME_WIDTH / 2, GAME_HEIGHT / 2, '#FFD700', 40);

            // Results
            drawText(`FINAL SCORE: ${gameState.player1.wins} - ${gameState.player2.wins}`, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 100, '#FFF', 16);

            // Instructions
            if (Math.floor(gameState.frameCount / 30) % 2 === 0) {
                drawText('PRESS ENTER FOR MAIN MENU', GAME_WIDTH / 2, GAME_HEIGHT - 80, '#00FF00', 14);
            }
        }

        // ============================================================================
        // UPDATE LOGIC
        // ============================================================================

        function updateTitleScreen() {
            // Nothing to update
        }

        function updateCharacterSelectScreen() {
            // P1 selection with A/D keys
            if (keys['a']) {
                const currentIndex = CHARACTER_KEYS.indexOf(gameState.player1.character);
                gameState.player1.character = CHARACTER_KEYS[(currentIndex - 1 + CHARACTER_KEYS.length) % CHARACTER_KEYS.length];
            }
            if (keys['d']) {
                const currentIndex = CHARACTER_KEYS.indexOf(gameState.player1.character);
                gameState.player1.character = CHARACTER_KEYS[(currentIndex + 1) % CHARACTER_KEYS.length];
            }

            // P2 selection with Arrow keys
            if (keys['arrowleft']) {
                const currentIndex = CHARACTER_KEYS.indexOf(gameState.player2.character);
                gameState.player2.character = CHARACTER_KEYS[(currentIndex - 1 + CHARACTER_KEYS.length) % CHARACTER_KEYS.length];
            }
            if (keys['arrowright']) {
                const currentIndex = CHARACTER_KEYS.indexOf(gameState.player2.character);
                gameState.player2.character = CHARACTER_KEYS[(currentIndex + 1) % CHARACTER_KEYS.length];
            }

            // Continue to stage select
            if (keys['enter']) {
                gameState.screen = 'stageSelect';
                gameState.frameCount = 0;
                keys['enter'] = false;
            }
        }

        function updateStageSelectScreen() {
            // Stage selection
            if (keys['arrowleft']) {
                gameState.selectedStage = Math.max(0, gameState.selectedStage - 1);
            }
            if (keys['arrowright']) {
                gameState.selectedStage = Math.min(STAGES.length - 1, gameState.selectedStage + 1);
            }
            if (keys['arrowup']) {
                gameState.selectedStage = Math.max(0, gameState.selectedStage - 3);
            }
            if (keys['arrowdown']) {
                gameState.selectedStage = Math.min(STAGES.length - 1, gameState.selectedStage + 3);
            }

            // Start battle
            if (keys['enter']) {
                gameState.screen = 'battle';
                gameState.frameCount = 0;
                gameState.currentRound = 1;
                gameState.player1.hp = 100;
                gameState.player2.hp = 100;
                keys['enter'] = false;
            }
        }

        function updateBattleScreen() {
            // Simulate damage
            if (gameState.frameCount % 60 === 0) {
                if (Math.random() > 0.5) {
                    gameState.player1.hp -= Math.random() * 20;
                } else {
                    gameState.player2.hp -= Math.random() * 20;
                }
            }

            // Check for KO
            if (gameState.player1.hp <= 0) {
                gameState.player2.wins++;
                if (gameState.player2.wins >= 3 || gameState.player1.wins >= 3) {
                    gameState.screen = 'victory';
                } else {
                    gameState.currentRound++;
                    gameState.frameCount = 0;
                    gameState.player1.hp = 100;
                    gameState.player2.hp = 100;
                }
            } else if (gameState.player2.hp <= 0) {
                gameState.player1.wins++;
                if (gameState.player1.wins >= 3 || gameState.player2.wins >= 3) {
                    gameState.screen = 'victory';
                } else {
                    gameState.currentRound++;
                    gameState.frameCount = 0;
                    gameState.player1.hp = 100;
                    gameState.player2.hp = 100;
                }
            }

            // Time out
            if (gameState.frameCount > 300 * 60) {
                if (gameState.player1.hp > gameState.player2.hp) {
                    gameState.player1.wins++;
                } else {
                    gameState.player2.wins++;
                }
                
                if (gameState.player1.wins >= 3 || gameState.player2.wins >= 3) {
                    gameState.screen = 'victory';
                } else {
                    gameState.currentRound++;
                    gameState.frameCount = 0;
                    gameState.player1.hp = 100;
                    gameState.player2.hp = 100;
                }
            }
        }

        function updateVictoryScreen() {
            if (keys['enter']) {
                gameState.screen = 'title';
                gameState.frameCount = 0;
                gameState.player1.wins = 0;
                gameState.player2.wins = 0;
                gameState.currentRound = 1;
                keys['enter'] = false;
            }
        }

        // ============================================================================
        // MAIN GAME LOOP
        // ============================================================================

        function gameLoop() {
            // Clear canvas
            drawRect(0, 0, GAME_WIDTH, GAME_HEIGHT, '#000');

            // Render current screen
            if (gameState.screen === 'title') {
                drawTitleScreen();
                updateTitleScreen();
            } else if (gameState.screen === 'characterSelect') {
                drawCharacterSelectScreen();
                updateCharacterSelectScreen();
            } else if (gameState.screen === 'stageSelect') {
                drawStageSelectScreen();
                updateStageSelectScreen();
            } else if (gameState.screen === 'battle') {
                drawBattleScreen();
                updateBattleScreen();
            } else if (gameState.screen === 'victory') {
                drawVictoryScreen();
                updateVictoryScreen();
            }

            gameState.frameCount++;
            requestAnimationFrame(gameLoop);
        }

        // ============================================================================
        // AUDIO SYNTHESIS (Web Audio API)
        // ============================================================================

        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(frequency, duration, type = 'sine') {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            
            osc.connect(gain);
            gain.connect(audioContext.destination);
            
            osc.type = type;
            osc.frequency.value = frequency;
            
            gain.gain.setValueAtTime(0.3, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            
            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime + duration);
        }

        function playPunchSound() {
            playSound(150, 0.1, 'triangle');
        }

        function playKickSound() {
            playSound(100, 0.15, 'sine');
        }

        function playSpecialSound() {
            playSound(300, 0.2, 'square');
        }

        function playKOSound() {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            
            osc.connect(gain);
            gain.connect(audioContext.destination);
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioContext.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioContext.currentTime + 0.5);
            
            gain.gain.setValueAtTime(0.3, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
            
            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime + 0.5);
        }

        // ============================================================================
        // START GAME
        // ============================================================================

        gameLoop();
    </script>
</body>
</html>
