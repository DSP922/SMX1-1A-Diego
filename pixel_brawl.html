<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL BRAWL - Fighting Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 4px solid #ffcc00;
            background: #000;
        }

        #gameContainer {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        // ============================================================================
        // PIXEL BRAWL - Fighting Game Engine (Complete Rewrite)
        // ============================================================================

        const GAME_WIDTH = 1280;
        const GAME_HEIGHT = 720;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;
        
        ctx.imageSmoothingEnabled = false;
        ctx.webkitImageSmoothingEnabled = false;
        ctx.mozImageSmoothingEnabled = false;
        ctx.msImageSmoothingEnabled = false;

        // ============================================================================
        // CHARACTER DEFINITIONS WITH SPECIAL ABILITIES
        // ============================================================================

        const CHARACTERS = {
            rago: {
                name: 'RAGO',
                color: '#FF3300',
                style: 'Fire Fighter',
                special: 'Fireball',
                cooldown: 12
            },
            frost: {
                name: 'FROST',
                color: '#3399FF',
                style: 'Ice Martial Artist',
                special: 'Ice Wall',
                cooldown: 18
            },
            venom: {
                name: 'VENOM',
                color: '#33CC33',
                style: 'Poison Brawler',
                special: 'Poison Strike',
                cooldown: 14
            },
            volt: {
                name: 'VOLT',
                color: '#FFFF00',
                style: 'Electric Speedster',
                special: 'Thunder Dash',
                cooldown: 13
            },
            specter: {
                name: 'SPECTER',
                color: '#9933FF',
                style: 'Shadow Ninja',
                special: 'Shadow Blink',
                cooldown: 20
            },
            stone: {
                name: 'STONE',
                color: '#CCCCCC',
                style: 'Heavy Grappler',
                special: 'Earthquake',
                cooldown: 16
            },
            blaze: {
                name: 'BLAZE',
                color: '#FF6600',
                style: 'Kickboxer',
                special: 'Inferno Kick',
                cooldown: 11
            },
            sakura: {
                name: 'SAKURA',
                color: '#FF69B4',
                style: 'Acrobatic Fighter',
                special: 'Petal Storm',
                cooldown: 17
            },
            void: {
                name: 'VOID',
                color: '#1A1A1A',
                style: 'Dark Energy Mage',
                special: 'Dark Orb',
                cooldown: 15
            }
        };

        const CHARACTER_KEYS = Object.keys(CHARACTERS);

        const STAGES = [
            { name: 'Dragon Dojo', bg: 'dojo' },
            { name: 'Neon City', bg: 'neon' },
            { name: 'Volcanic Crater', bg: 'volcano' },
            { name: 'Frozen Tundra', bg: 'tundra' },
            { name: 'Ancient Ruins', bg: 'ruins' },
            { name: 'Sky Colosseum', bg: 'sky' }
        ];

        // ============================================================================
        // PROJECTILE AND EFFECT SYSTEM
        // ============================================================================

        let projectiles = [];
        let effects = [];
        let iceWalls = [];

        class Projectile {
            constructor(x, y, vx, vy, damage, type, owner) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.damage = damage;
                this.type = type; // 'fireball', 'darkOrb', 'petalStorm'
                this.owner = owner; // 'p1' or 'p2'
                this.active = true;
                this.size = 4;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Gravity for some projectiles
                if (this.type === 'petalStorm') {
                    this.vy += 0.3;
                }

                // Out of bounds
                if (this.x < 0 || this.x > GAME_WIDTH || this.y > GAME_HEIGHT) {
                    this.active = false;
                }
            }

            draw() {
                if (this.type === 'fireball') {
                    drawFilledCircle(this.x, this.y, this.size, '#FF6600', '#000000', 1);
                } else if (this.type === 'darkOrb') {
                    drawFilledCircle(this.x, this.y, this.size + 1, '#1a1a1a', '#9933FF', 2);
                } else if (this.type === 'petalStorm') {
                    drawFilledRect(this.x - 2, this.y - 2, 4, 4, '#FF69B4', '#000000', 1);
                }
            }
        }

        class IceWall {
            constructor(x, y, duration) {
                this.x = x;
                this.y = y;
                this.width = 20;
                this.height = 100;
                this.duration = duration;
                this.maxDuration = duration;
                this.active = true;
            }

            update() {
                this.duration--;
                if (this.duration <= 0) {
                    this.active = false;
                }
            }

            draw() {
                const opacity = this.duration / this.maxDuration;
                ctx.fillStyle = `rgba(51, 153, 255, ${opacity * 0.6})`;
                ctx.fillRect(this.x - this.width / 2, this.y - this.height / 2, this.width, this.height);
                ctx.strokeStyle = '#3399FF';
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x - this.width / 2, this.y - this.height / 2, this.width, this.height);
            }

            getBounds() {
                return {
                    x: this.x - this.width / 2,
                    y: this.y - this.height / 2,
                    w: this.width,
                    h: this.height
                };
            }
        }

        class Effect {
            constructor(x, y, type, duration) {
                this.x = x;
                this.y = y;
                this.type = type; // 'teleport', 'dash', 'shockwave', poison
                this.duration = duration;
                this.maxDuration = duration;
                this.active = true;
            }

            update() {
                this.duration--;
                if (this.duration <= 0) {
                    this.active = false;
                }
            }

            draw() {
                if (this.type === 'teleport-start') {
                    const opacity = this.duration / this.maxDuration;
                    ctx.fillStyle = `rgba(0, 0, 0, ${opacity * 0.8})`;
                    ctx.fillRect(this.x - 20, this.y - 50, 40, 80);
                } else if (this.type === 'teleport-end') {
                    const opacity = this.duration / this.maxDuration;
                    ctx.fillStyle = `rgba(153, 51, 255, ${opacity * 0.6})`;
                    ctx.fillRect(this.x - 20, this.y - 50, 40, 80);
                } else if (this.type === 'dashtrail') {
                    const opacity = this.duration / this.maxDuration;
                    ctx.fillStyle = `rgba(255, 255, 0, ${opacity * 0.4})`;
                    ctx.fillRect(this.x - 10, this.y - 25, 20, 50);
                } else if (this.type === 'poison') {
                    ctx.fillStyle = '#33CC33';
                    ctx.globalAlpha = 0.5;
                    ctx.fillRect(this.x - 20, this.y - 50, 40, 80);
                    ctx.globalAlpha = 1.0;
                } else if (this.type === 'shockwave') {
                    const opacity = this.duration / this.maxDuration;
                    const expandSize = (1 - opacity) * 200;
                    ctx.strokeStyle = `rgba(200, 200, 200, ${opacity * 0.8})`;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x + expandSize, this.y);
                    ctx.stroke();
                }
            }
        }

        // ============================================================================
        // GAME STATE
        // ============================================================================

        let gameState = {
            screen: 'title',
            player1: {
                character: 'rago',
                wins: 0,
                // Battle state
                x: 200,
                y: 480,
                vy: 0,
                hp: 100,
                facing: 1, // 1 = right, -1 = left
                action: 'idle', // idle, walk, punch, kick, hurt, jump
                actionFrame: 0,
                isGrounded: true,
                hurtbox: { x: 0, y: 0, w: 40, h: 80 },
                hitbox: null,
                keys: { left: false, right: false, up: false, punch: false, kick: false, special: false },
                specialCooldown: 0,
                specialMaxCooldown: 0,
                poisoned: false,
                poisonDuration: 0,
                poisonDPS: 0,
                poisonTick: 0
            },
            player2: {
                character: 'void',
                wins: 0,
                x: 1080,
                y: 480,
                vy: 0,
                hp: 100,
                facing: -1,
                action: 'idle',
                actionFrame: 0,
                isGrounded: true,
                hurtbox: { x: 0, y: 0, w: 40, h: 80 },
                hitbox: null,
                keys: { left: false, right: false, up: false, punch: false, kick: false, special: false },
                specialCooldown: 0,
                specialMaxCooldown: 0,
                poisoned: false,
                poisonDuration: 0,
                poisonDPS: 0,
                poisonTick: 0
            },
            selectedStage: 0,
            selectedCharP1: 0,
            selectedCharP2: 0,
            p1Confirmed: false,
            p2Confirmed: false,
            currentRound: 1,
            frameCount: 0,
            hitstopFrames: 0,
            isPaused: false
        };

        const GROUND_Y = 480;
        const GRAVITY = 0.5;
        const MOVE_SPEED = 4;
        const JUMP_POWER = -12;

        // ============================================================================
        // INPUT HANDLING
        // ============================================================================

        const keys = {};
        
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            keys[key] = true;
            
            // Handle Ñ key for Player 2 kick
            if (e.key === 'ñ') {
                keys['ñ'] = true;
            }
            
            if (key === 'enter' && gameState.screen === 'title') {
                gameState.screen = 'characterSelect';
                gameState.frameCount = 0;
                gameState.p1Confirmed = false;
                gameState.p2Confirmed = false;
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            keys[key] = false;
            if (e.key === 'ñ') {
                keys['ñ'] = false;
            }
        });

        // ============================================================================
        // DRAWING UTILITIES - ALL ELEMENTS WITH BLACK OUTLINES
        // ============================================================================

        function drawFilledRect(x, y, w, h, fillColor, strokeColor = '#000000', lineWidth = 2) {
            ctx.fillStyle = fillColor;
            ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = lineWidth;
            ctx.strokeRect(x, y, w, h);
        }

        function drawFilledCircle(x, y, r, fillColor, strokeColor = '#000000', lineWidth = 2) {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = fillColor;
            ctx.fill();
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = lineWidth;
            ctx.stroke();
        }

        function drawLine(x1, y1, x2, y2, strokeColor = '#000000', lineWidth = 2) {
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = lineWidth;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
        }

        function drawText(text, x, y, fillColor = '#FFF', size = 16) {
            ctx.fillStyle = fillColor;
            ctx.font = `${size}px 'Press Start 2P'`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, x, y);
        }

        function drawPixelatedBox(x, y, w, h, fillColor, borderColor = '#000000', borderWidth = 3) {
            drawFilledRect(x, y, w, h, fillColor, borderColor, borderWidth);
        }

        // ============================================================================
        // CHARACTER DRAWING (Pixel Art Stickmen with Black Outlines)
        // ============================================================================

        function drawCharacter(player, x, y, size = 1) {
            const char = CHARACTERS[player.character];
            const facing = player.facing;
            const action = player.action;
            const frame = player.actionFrame;
            let color = char.color;

            // Poison effect visual
            if (player.poisoned) {
                ctx.globalAlpha = 0.6;
                ctx.fillStyle = '#33CC33';
                ctx.fillRect(x - 20 * size, y - 50 * size, 40 * size, 80 * size);
                ctx.globalAlpha = 1.0;
            }

            const headR = 8 * size;
            const torsoH = 20 * size;
            const limbW = 4 * size;
            const limbL = 12 * size;

            // Animation offsets
            let bodyBob = 0;
            let armL_offset = 0, armR_offset = 0;
            let legL_offset = 0, legR_offset = 0;
            let bodyX = 0;

            if (action === 'idle') {
                bodyBob = Math.sin(frame * 0.15) * 2;
            } else if (action === 'walk') {
                bodyBob = Math.sin(frame * 0.2) * 1.5;
                armL_offset = Math.sin(frame * 0.2) * 3;
                armR_offset = -Math.sin(frame * 0.2) * 3;
                legL_offset = Math.sin(frame * 0.2) * 4;
                legR_offset = -Math.sin(frame * 0.2) * 4;
            } else if (action === 'punch') {
                if (frame < 5) armR_offset = frame * 2; // wind-up
                else if (frame < 8) armR_offset = 10 + (frame - 5) * 4; // extend
                else armR_offset = Math.max(0, 12 - (frame - 8) * 4); // retract
            } else if (action === 'kick') {
                if (frame < 5) legR_offset = frame * 2;
                else if (frame < 8) legR_offset = 10 + (frame - 5) * 5;
                else legR_offset = Math.max(0, 15 - (frame - 8) * 5);
            } else if (action === 'hurt') {
                bodyX = -15 * facing;
            } else if (action === 'jump') {
                bodyBob = -15;
            }

            // Head
            drawFilledCircle(x + bodyX, y + bodyBob - headR, headR, color, '#000000', 2);

            // Torso
            drawFilledRect(x + bodyX - 6 * size, y + bodyBob, 12 * size, torsoH, color, '#000000', 2);

            // Left arm
            const armL_x = x + bodyX - 8 * size * facing;
            const armL_y = y + bodyBob + 4 * size;
            const armL_x2 = armL_x - (limbL + armL_offset) * facing;
            drawLine(armL_x, armL_y, armL_x2, armL_y, color, 4);

            // Right arm
            const armR_x = x + bodyX + 8 * size * facing;
            const armR_y = y + bodyBob + 4 * size;
            const armR_x2 = armR_x + (limbL + armR_offset) * facing;
            drawLine(armR_x, armR_y, armR_x2, armR_y, color, 4);

            // Left leg
            const legL_y = y + bodyBob + torsoH;
            const legL_x2 = x + bodyX - 4 * size * facing + legL_offset;
            drawLine(x + bodyX - 4 * size * facing, legL_y, legL_x2, legL_y + limbL, color, 4);

            // Right leg
            const legR_x2 = x + bodyX + 4 * size * facing + legR_offset;
            drawLine(x + bodyX + 4 * size * facing, legL_y, legR_x2, legL_y + limbL, color, 4);
        }

        // ============================================================================
        // SCREEN RENDERERS
        // ============================================================================

        function drawTitleScreen() {
            // Background
            drawFilledRect(0, 0, GAME_WIDTH, GAME_HEIGHT, '#000000');

            // Grid pattern
            for (let i = 0; i < GAME_WIDTH; i += 40) {
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, GAME_HEIGHT);
                ctx.stroke();
            }
            for (let i = 0; i < GAME_HEIGHT; i += 40) {
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(GAME_WIDTH, i);
                ctx.stroke();
            }

            // Title
            drawText('PIXEL BRAWL', GAME_WIDTH / 2, 100, '#FFD700', 48);
            drawText('FIGHTING GAME', GAME_WIDTH / 2, 200, '#FF6600', 24);

            // Blinking enter text
            if (Math.floor(gameState.frameCount / 30) % 2 === 0) {
                drawText('PRESS ENTER TO START', GAME_WIDTH / 2, GAME_HEIGHT - 150, '#00FF00', 16);
            }

            drawText('© 2026 PIXEL BRAWL STUDIOS', GAME_WIDTH / 2, GAME_HEIGHT - 50, '#666', 12);
        }

        function drawCharacterSelectScreen() {
            // Background
            drawFilledRect(0, 0, GAME_WIDTH, GAME_HEIGHT, '#0a0a0a');

            // Title
            drawText('CHARACTER SELECT', GAME_WIDTH / 2, 40, '#FFD700', 32);

            // LEFT SIDE - PLAYER 1
            const p1BorderColor = gameState.p1Confirmed ? '#00FF00' : '#FF0000';
            drawPixelatedBox(40, 80, 220, 320, '#1a1a1a', p1BorderColor, 3);
            drawText('PLAYER 1', 150, 100, '#FF0000', 16);
            const p1Char = CHARACTERS[CHARACTER_KEYS[gameState.selectedCharP1]];
            drawText(p1Char.name, 150, 200, '#FFD700', 16);
            drawCharacter({ character: CHARACTER_KEYS[gameState.selectedCharP1], action: 'idle', actionFrame: gameState.frameCount, facing: 1, poisoned: false }, 150, 250, 1.5);
            
            if (gameState.p1Confirmed) {
                drawText('READY!', 150, 300, '#00FF00', 12);
            }

            // CENTER - CHARACTER GRID
            const charPerRow = 5;
            const charSize = 60;
            const gridStartX = 350;
            const gridStartY = 100;

            for (let i = 0; i < CHARACTER_KEYS.length; i++) {
                const row = Math.floor(i / charPerRow);
                const col = i % charPerRow;
                const cx = gridStartX + col * (charSize + 20);
                const cy = gridStartY + row * (charSize + 20);
                const charKey = CHARACTER_KEYS[i];
                const isSelectedP1 = gameState.selectedCharP1 === i;
                const borderColor = isSelectedP1 ? '#FFD700' : '#666';
                const borderWidth = isSelectedP1 ? 3 : 2;

                drawPixelatedBox(cx, cy, charSize, charSize, '#0a0a0a', borderColor, borderWidth);
                drawCharacter({ character: charKey, action: 'idle', actionFrame: gameState.frameCount, facing: 1, poisoned: false }, cx + charSize / 2, cy + charSize - 10, 0.8);
            }

            // RIGHT SIDE - PLAYER 2
            const p2BorderColor = gameState.p2Confirmed ? '#00FF00' : '#0000FF';
            drawPixelatedBox(1020, 80, 220, 320, '#1a1a1a', p2BorderColor, 3);
            drawText('PLAYER 2', 1130, 100, '#0000FF', 16);
            const p2Char = CHARACTERS[CHARACTER_KEYS[gameState.selectedCharP2]];
            drawText(p2Char.name, 1130, 200, '#FFD700', 16);
            drawCharacter({ character: CHARACTER_KEYS[gameState.selectedCharP2], action: 'idle', actionFrame: gameState.frameCount, facing: -1, poisoned: false }, 1130, 250, 1.5);
            
            if (gameState.p2Confirmed) {
                drawText('READY!', 1130, 300, '#00FF00', 12);
            }

            // Instructions
            drawText('P1: ARROW KEYS + SPACE to confirm', GAME_WIDTH / 2, GAME_HEIGHT - 80, '#00FF00', 12);
            drawText('P2: ARROW KEYS + ENTER to confirm', GAME_WIDTH / 2, GAME_HEIGHT - 40, '#00FF00', 12);
        }

        function drawStageSelectScreen() {
            drawFilledRect(0, 0, GAME_WIDTH, GAME_HEIGHT, '#0a0a0a');
            drawText('STAGE SELECT', GAME_WIDTH / 2, 40, '#FFD700', 32);

            const gridX = 100;
            const gridY = 150;
            const stageWidth = 180;
            const stageHeight = 100;
            const stagesPerRow = 3;

            for (let i = 0; i < STAGES.length; i++) {
                const row = Math.floor(i / stagesPerRow);
                const col = i % stagesPerRow;
                const x = gridX + col * (stageWidth + 60);
                const y = gridY + row * (stageHeight + 60);
                const stage = STAGES[i];
                const isSelected = gameState.selectedStage === i;
                const borderColor = isSelected ? '#00FF00' : '#FFD700';
                const borderWidth = isSelected ? 4 : 2;

                drawPixelatedBox(x, y, stageWidth, stageHeight, '#1a1a1a', borderColor, borderWidth);
                drawText(stage.name, x + stageWidth / 2, y + 30, '#FFD700', 12);
            }

            drawText('ARROW KEYS: SELECT | ENTER: START BATTLE', GAME_WIDTH / 2, GAME_HEIGHT - 40, '#00FF00', 12);
        }

        function drawBattleBackground() {
            const stage = STAGES[gameState.selectedStage];
            drawFilledRect(0, 0, GAME_WIDTH, GAME_HEIGHT, '#1a1a1a');

            if (stage.bg === 'dojo') {
                drawFilledRect(0, GROUND_Y + 40, GAME_WIDTH, GAME_HEIGHT - GROUND_Y - 40, '#8B4513', '#654321', 2);
                for (let i = 0; i < GAME_WIDTH; i += 100) {
                    drawFilledRect(i, GROUND_Y + 40, 2, GAME_HEIGHT - GROUND_Y - 40, '#654321');
                }
            } else if (stage.bg === 'neon') {
                drawFilledRect(0, 0, GAME_WIDTH, GAME_HEIGHT * 0.7, '#001a33');
                drawFilledRect(0, GAME_HEIGHT * 0.7, GAME_WIDTH, GAME_HEIGHT * 0.3, '#0a0a1a');
            } else if (stage.bg === 'volcano') {
                drawFilledRect(0, 0, GAME_WIDTH, GAME_HEIGHT * 0.5, '#330000');
                drawFilledRect(0, GAME_HEIGHT * 0.5, GAME_WIDTH, GAME_HEIGHT * 0.5, '#FF3300');
            } else if (stage.bg === 'tundra') {
                drawFilledRect(0, 0, GAME_WIDTH, GAME_HEIGHT, '#E0F4FF');
            } else if (stage.bg === 'ruins') {
                drawFilledRect(0, 0, GAME_WIDTH, GAME_HEIGHT, '#2d5016');
            } else if (stage.bg === 'sky') {
                drawFilledRect(0, 0, GAME_WIDTH, GAME_HEIGHT, '#1a3a5c');
            }

            // Ground line
            drawLine(0, GROUND_Y + 40, GAME_WIDTH, GROUND_Y + 40, '#CCCCCC', 3);
        }

        function drawCooldownBar(x, y, cooldown, maxCooldown, abilityName) {
            const barWidth = 80;
            const barHeight = 8;
            const percent = Math.min(1, cooldown / maxCooldown);
            
            // Background
            drawFilledRect(x, y, barWidth, barHeight, '#333', '#FFF', 1);
            
            // Fill
            const fillColor = cooldown === 0 ? '#00FF00' : '#FFFF00';
            drawFilledRect(x, y, barWidth * percent, barHeight, fillColor, 'none', 0);
            
            // Ability name (tiny text)
            ctx.fillStyle = '#FFF';
            ctx.font = '8px "Press Start 2P"';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText(abilityName, x, y + 12);
        }

        function drawBattleScreen() {
            drawBattleBackground();

            // HUD background
            drawFilledRect(0, 0, GAME_WIDTH, 100, 'rgba(0,0,0,0.8)', '#FFFF00', 2);

            // P1 Health
            const p1HPPercent = Math.max(0, gameState.player1.hp / 100);
            const p1HPColor = gameState.player1.hp > 50 ? '#00FF00' : gameState.player1.hp > 25 ? '#FFFF00' : '#FF0000';
            drawPixelatedBox(20, 10, 200, 20, '#333', '#FFF', 1);
            drawFilledRect(20, 10, 200 * p1HPPercent, 20, p1HPColor);

            // P1 Cooldown
            const p1Char = CHARACTERS[gameState.player1.character];
            drawCooldownBar(20, 35, gameState.player1.specialCooldown, gameState.player1.specialMaxCooldown, p1Char.special);

            // P2 Health
            const p2HPPercent = Math.max(0, gameState.player2.hp / 100);
            const p2HPColor = gameState.player2.hp > 50 ? '#00FF00' : gameState.player2.hp > 25 ? '#FFFF00' : '#FF0000';
            drawPixelatedBox(GAME_WIDTH - 220, 10, 200, 20, '#333', '#FFF', 1);
            drawFilledRect(GAME_WIDTH - 220, 10, 200 * p2HPPercent, 20, p2HPColor);

            // P2 Cooldown
            const p2Char = CHARACTERS[gameState.player2.character];
            drawCooldownBar(GAME_WIDTH - 220, 35, gameState.player2.specialCooldown, gameState.player2.specialMaxCooldown, p2Char.special);

            // Round info
            drawText(`ROUND ${gameState.currentRound}`, GAME_WIDTH / 2, 25, '#FFD700', 16);

            // Draw ice walls
            for (let wall of iceWalls) {
                wall.draw();
            }

            // Draw projectiles
            for (let proj of projectiles) {
                proj.draw();
            }

            // Draw effects
            for (let effect of effects) {
                effect.draw();
            }

            // Characters
            drawCharacter(gameState.player1, gameState.player1.x, gameState.player1.y, 2);
            drawCharacter(gameState.player2, gameState.player2.x, gameState.player2.y, 2);

            // Fight intro
            if (gameState.frameCount < 120) {
                if (gameState.frameCount < 60) {
                    drawText('FIGHT!', GAME_WIDTH / 2, GAME_HEIGHT / 2, '#FF0000', 48);
                }
            }
        }

        function drawVictoryScreen() {
            drawFilledRect(0, 0, GAME_WIDTH, GAME_HEIGHT, '#0a0a0a');
            const winner = gameState.player1.wins > gameState.player2.wins ? 'PLAYER 1' : 'PLAYER 2';
            const winColor = gameState.player1.wins > gameState.player2.wins ? '#FF0000' : '#0000FF';

            drawText(winner, GAME_WIDTH / 2, GAME_HEIGHT / 2 - 100, winColor, 48);
            drawText('WINS!', GAME_WIDTH / 2, GAME_HEIGHT / 2, '#FFD700', 48);
            drawText(`FINAL SCORE: ${gameState.player1.wins} - ${gameState.player2.wins}`, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 100, '#FFF', 16);

            if (Math.floor(gameState.frameCount / 30) % 2 === 0) {
                drawText('PRESS ENTER FOR MAIN MENU', GAME_WIDTH / 2, GAME_HEIGHT - 80, '#00FF00', 14);
            }
        }

        // ============================================================================
        // SPECIAL ABILITY EXECUTION
        // ============================================================================

        function triggerSpecialAbility(player, opponent) {
            const char = player.character;
            const charData = CHARACTERS[char];

            if (char === 'rago') {
                // Fireball
                const proj = new Projectile(
                    player.x + 30 * player.facing,
                    player.y - 10,
                    8 * player.facing,
                    0,
                    18,
                    'fireball',
                    player === gameState.player1 ? 'p1' : 'p2'
                );
                projectiles.push(proj);
            } else if (char === 'frost') {
                // Ice Wall
                const wall = new IceWall(player.x + 40 * player.facing, player.y, 180); // 3 seconds * 60 fps
                iceWalls.push(wall);
            } else if (char === 'venom') {
                // Poison Strike - buff next punch
                player.poisoned = true;
                effects.push(new Effect(player.x, player.y, 'poison', 120));
            } else if (char === 'volt') {
                // Thunder Dash
                player.action = 'dash';
                player.actionFrame = 0;
            } else if (char === 'specter') {
                // Shadow Blink
                effects.push(new Effect(player.x, player.y, 'teleport-start', 10));
                player.x = opponent.x - 60 * opponent.facing;
                effects.push(new Effect(player.x, player.y, 'teleport-end', 10));
                
                // Check if close for auto-hit
                const dist = Math.abs(player.x - opponent.x);
                if (dist < 100) {
                    opponent.hp = Math.max(0, opponent.hp - 15);
                    opponent.action = 'hurt';
                    opponent.actionFrame = 0;
                    gameState.hitstopFrames = 5;
                }
            } else if (char === 'stone') {
                // Earthquake - shockwave
                effects.push(new Effect(player.x, GROUND_Y + 40, 'shockwave', 30));
                
                // Check if opponent is hit
                const dist = Math.abs(player.x - opponent.x);
                if (dist < 300) {
                    opponent.hp = Math.max(0, opponent.hp - 22);
                    opponent.action = 'hurt';
                    opponent.actionFrame = 0;
                    gameState.hitstopFrames = 10; // stun
                }
            } else if (char === 'blaze') {
                // Inferno Kick
                player.action = 'inferno-kick';
                player.actionFrame = 0;
            } else if (char === 'sakura') {
                // Petal Storm - 3 projectiles
                for (let i = -1; i <= 1; i++) {
                    const angle = i * 0.3;
                    const vx = 6 * player.facing;
                    const vy = i * 2;
                    const proj = new Projectile(
                        player.x + 20 * player.facing,
                        player.y - 10 + i * 10,
                        vx,
                        vy,
                        8,
                        'petalStorm',
                        player === gameState.player1 ? 'p1' : 'p2'
                    );
                    projectiles.push(proj);
                }
            } else if (char === 'void') {
                // Dark Orb
                const proj = new Projectile(
                    player.x + 30 * player.facing,
                    player.y - 10,
                    4 * player.facing,
                    0,
                    30,
                    'darkOrb',
                    player === gameState.player1 ? 'p1' : 'p2'
                );
                projectiles.push(proj);
            }

            player.specialCooldown = charData.cooldown * 60; // Convert seconds to frames
            player.specialMaxCooldown = charData.cooldown * 60;
        }

        // ============================================================================
        // UPDATE LOGIC
        // ============================================================================

        function updateCharacterSelectScreen() {
            // P1 selection (arrow keys) - only if not confirmed
            if (!gameState.p1Confirmed) {
                if (keys['arrowleft']) {
                    gameState.selectedCharP1 = Math.max(0, gameState.selectedCharP1 - 1);
                    keys['arrowleft'] = false;
                }
                if (keys['arrowright']) {
                    gameState.selectedCharP1 = Math.min(CHARACTER_KEYS.length - 1, gameState.selectedCharP1 + 1);
                    keys['arrowright'] = false;
                }
                if (keys['arrowup']) {
                    gameState.selectedCharP1 = Math.max(0, gameState.selectedCharP1 - 5);
                    keys['arrowup'] = false;
                }
                if (keys['arrowdown']) {
                    gameState.selectedCharP1 = Math.min(CHARACTER_KEYS.length - 1, gameState.selectedCharP1 + 5);
                    keys['arrowdown'] = false;
                }

                if (keys[' ']) {
                    gameState.p1Confirmed = true;
                    keys[' '] = false;
                }
            }

            // P2 selection (arrow keys) - only if not confirmed
            if (!gameState.p2Confirmed) {
                if (keys['arrowleft']) {
                    gameState.selectedCharP2 = Math.max(0, gameState.selectedCharP2 - 1);
                    keys['arrowleft'] = false;
                }
                if (keys['arrowright']) {
                    gameState.selectedCharP2 = Math.min(CHARACTER_KEYS.length - 1, gameState.selectedCharP2 + 1);
                    keys['arrowright'] = false;
                }
                if (keys['arrowup']) {
                    gameState.selectedCharP2 = Math.max(0, gameState.selectedCharP2 - 5);
                    keys['arrowup'] = false;
                }
                if (keys['arrowdown']) {
                    gameState.selectedCharP2 = Math.min(CHARACTER_KEYS.length - 1, gameState.selectedCharP2 + 5);
                    keys['arrowdown'] = false;
                }

                if (keys['enter']) {
                    gameState.p2Confirmed = true;
                    keys['enter'] = false;
                }
            }

            // Both players confirmed - proceed to stage select
            if (gameState.p1Confirmed && gameState.p2Confirmed) {
                gameState.player1.character = CHARACTER_KEYS[gameState.selectedCharP1];
                gameState.player2.character = CHARACTER_KEYS[gameState.selectedCharP2];
                gameState.player1.specialMaxCooldown = CHARACTERS[gameState.player1.character].cooldown * 60;
                gameState.player2.specialMaxCooldown = CHARACTERS[gameState.player2.character].cooldown * 60;
                gameState.screen = 'stageSelect';
                gameState.frameCount = 0;
                gameState.p1Confirmed = false;
                gameState.p2Confirmed = false;
            }
        }

        function updateStageSelectScreen() {
            if (keys['arrowleft']) {
                gameState.selectedStage = Math.max(0, gameState.selectedStage - 1);
                keys['arrowleft'] = false;
            }
            if (keys['arrowright']) {
                gameState.selectedStage = Math.min(STAGES.length - 1, gameState.selectedStage + 1);
                keys['arrowright'] = false;
            }
            if (keys['arrowup']) {
                gameState.selectedStage = Math.max(0, gameState.selectedStage - 3);
                keys['arrowup'] = false;
            }
            if (keys['arrowdown']) {
                gameState.selectedStage = Math.min(STAGES.length - 1, gameState.selectedStage + 3);
                keys['arrowdown'] = false;
            }

            if (keys['enter']) {
                gameState.screen = 'battle';
                gameState.frameCount = 0;
                gameState.currentRound = 1;
                gameState.player1.hp = 100;
                gameState.player2.hp = 100;
                gameState.player1.x = 200;
                gameState.player2.x = GAME_WIDTH - 200;
                gameState.player1.y = GROUND_Y;
                gameState.player2.y = GROUND_Y;
                gameState.player1.vy = 0;
                gameState.player2.vy = 0;
                gameState.player1.facing = 1;
                gameState.player2.facing = -1;
                gameState.player1.isGrounded = true;
                gameState.player2.isGrounded = true;
                gameState.player1.action = 'idle';
                gameState.player2.action = 'idle';
                gameState.player1.actionFrame = 0;
                gameState.player2.actionFrame = 0;
                gameState.player1.specialCooldown = 0;
                gameState.player2.specialCooldown = 0;
                projectiles = [];
                effects = [];
                iceWalls = [];
                keys['enter'] = false;
            }
        }

        function updatePlayerInput() {
            // Player 1: WASD + F/G/E
            gameState.player1.keys.left = keys['a'];
            gameState.player1.keys.right = keys['d'];
            gameState.player1.keys.up = keys['w'];
            gameState.player1.keys.punch = keys['f'];
            gameState.player1.keys.kick = keys['g'];
            gameState.player1.keys.special = keys['e'];

            // Player 2: Arrow keys + L/Ñ/P
            gameState.player2.keys.left = keys['arrowleft'];
            gameState.player2.keys.right = keys['arrowright'];
            gameState.player2.keys.up = keys['arrowup'];
            gameState.player2.keys.punch = keys['l'];
            gameState.player2.keys.kick = keys['ñ'];
            gameState.player2.keys.special = keys['p'];
        }

        function updatePlayer(player, opponent) {
            // Cooldown
            if (player.specialCooldown > 0) {
                player.specialCooldown--;
            }

            // Poison damage
            if (player.poisoned) {
                player.poisonTick++;
                if (player.poisonTick >= 30) { // every 0.5 seconds at 60fps
                    player.hp = Math.max(0, player.hp - player.poisonDPS);
                    player.poisonTick = 0;
                    player.poisonDuration--;
                    if (player.poisonDuration <= 0) {
                        player.poisoned = false;
                    }
                }
            }

            // Gravity
            player.vy += GRAVITY;
            player.y += player.vy;

            // Ground collision
            if (player.y >= GROUND_Y) {
                player.y = GROUND_Y;
                player.vy = 0;
                player.isGrounded = true;
            } else {
                player.isGrounded = false;
            }

            // Movement
            if (player.keys.left && player.x > 50) {
                player.x -= MOVE_SPEED;
                if (player.action === 'idle') player.action = 'walk';
                player.facing = -1;
            } else if (player.keys.right && player.x < GAME_WIDTH - 50) {
                player.x += MOVE_SPEED;
                if (player.action === 'idle') player.action = 'walk';
                player.facing = 1;
            } else if (player.action === 'walk') {
                player.action = 'idle';
                player.actionFrame = 0;
            }

            // Jump
            if (player.keys.up && player.isGrounded) {
                player.vy = JUMP_POWER;
                player.isGrounded = false;
                player.action = 'jump';
            }

            // Actions
            if (player.keys.punch && player.action === 'idle' && gameState.hitstopFrames === 0) {
                player.action = 'punch';
                player.actionFrame = 0;
            } else if (player.keys.kick && player.action === 'idle' && gameState.hitstopFrames === 0) {
                player.action = 'kick';
                player.actionFrame = 0;
            } else if (player.keys.special && player.specialCooldown === 0 && gameState.hitstopFrames === 0) {
                triggerSpecialAbility(player, opponent);
                player.keys.special = false;
            }

            // Action animation loop
            if (player.action === 'punch') {
                player.actionFrame++;
                if (player.actionFrame >= 12) {
                    player.action = 'idle';
                    player.actionFrame = 0;
                }
                // Hitbox frames 5-8
                if (player.actionFrame >= 5 && player.actionFrame <= 8) {
                    const hbX = player.x + 25 * player.facing;
                    const hbY = player.y - 10;
                    player.hitbox = { x: hbX, y: hbY, w: 20, h: 20 };

                    // Apply poison if active
                    if (player.poisoned && player.actionFrame === 5) {
                        opponent.poisoned = true;
                        opponent.poisonDuration = 4; // 2 seconds at 30ticks
                        opponent.poisonDPS = 3;
                        opponent.poisonTick = 0;
                        player.poisoned = false;
                    }
                } else {
                    player.hitbox = null;
                }
            } else if (player.action === 'kick') {
                player.actionFrame++;
                if (player.actionFrame >= 12) {
                    player.action = 'idle';
                    player.actionFrame = 0;
                }
                // Hitbox frames 5-8
                if (player.actionFrame >= 5 && player.actionFrame <= 8) {
                    const hbX = player.x + 30 * player.facing;
                    const hbY = player.y - 5;
                    player.hitbox = { x: hbX, y: hbY, w: 25, h: 15 };
                } else {
                    player.hitbox = null;
                }
            } else if (player.action === 'hurt') {
                player.actionFrame++;
                if (player.actionFrame >= 10) {
                    player.action = 'idle';
                    player.actionFrame = 0;
                }
            } else if (player.action === 'jump') {
                if (player.isGrounded) {
                    player.action = 'idle';
                    player.actionFrame = 0;
                }
            } else if (player.action === 'dash') {
                // Volt Thunder Dash
                player.x += 10 * player.facing;
                effects.push(new Effect(player.x, player.y, 'dashtrail', 20));
                player.actionFrame++;
                if (player.actionFrame >= 15) {
                    player.action = 'idle';
                    player.actionFrame = 0;
                }
            } else if (player.action === 'inferno-kick') {
                // Blaze Inferno Kick
                if (player.actionFrame < 3) {
                    player.vy = JUMP_POWER;
                }
                player.x += 6 * player.facing;
                player.actionFrame++;
                
                // Hitbox
                if (player.actionFrame >= 3 && player.actionFrame <= 12) {
                    const hbX = player.x + 25 * player.facing;
                    const hbY = player.y - 10;
                    player.hitbox = { x: hbX, y: hbY, w: 25, h: 20 };
                } else {
                    player.hitbox = null;
                }
                
                if (player.actionFrame >= 15) {
                    player.action = 'idle';
                    player.actionFrame = 0;
                }
            } else {
                player.actionFrame++;
                if (player.actionFrame >= 30) player.actionFrame = 0;
            }

            // Update hurtbox
            player.hurtbox = {
                x: player.x - 20,
                y: player.y - 40,
                w: 40,
                h: 80
            };
        }

        function checkAABBCollision(box1, box2) {
            return box1.x < box2.x + box2.w &&
                   box1.x + box1.w > box2.x &&
                   box1.y < box2.y + box2.h &&
                   box1.y + box1.h > box2.y;
        }

        function updateBattleScreen() {
            if (gameState.hitstopFrames > 0) {
                gameState.hitstopFrames--;
                // Still update effects and projectiles during hitstop
                projectiles = projectiles.filter(p => {
                    p.update();
                    return p.active;
                });
                effects = effects.filter(e => {
                    e.update();
                    return e.active;
                });
                iceWalls = iceWalls.filter(w => {
                    w.update();
                    return w.active;
                });
                return;
            }

            updatePlayerInput();
            updatePlayer(gameState.player1, gameState.player2);
            updatePlayer(gameState.player2, gameState.player1);

            // Update projectiles
            projectiles = projectiles.filter(p => {
                p.update();
                return p.active;
            });

            // Update effects
            effects = effects.filter(e => {
                e.update();
                return e.active;
            });

            // Update ice walls
            iceWalls = iceWalls.filter(w => {
                w.update();
                return w.active;
            });

            // Projectile collision detection
            for (let proj of projectiles) {
                if (proj.owner === 'p1' && checkAABBCollision(
                    { x: proj.x - proj.size, y: proj.y - proj.size, w: proj.size * 2, h: proj.size * 2 },
                    gameState.player2.hurtbox
                )) {
                    gameState.player2.hp = Math.max(0, gameState.player2.hp - proj.damage);
                    gameState.player2.action = 'hurt';
                    gameState.player2.actionFrame = 0;
                    gameState.player2.x -= 15 * gameState.player2.facing;
                    proj.active = false;
                    gameState.hitstopFrames = 3;
                } else if (proj.owner === 'p2' && checkAABBCollision(
                    { x: proj.x - proj.size, y: proj.y - proj.size, w: proj.size * 2, h: proj.size * 2 },
                    gameState.player1.hurtbox
                )) {
                    gameState.player1.hp = Math.max(0, gameState.player1.hp - proj.damage);
                    gameState.player1.action = 'hurt';
                    gameState.player1.actionFrame = 0;
                    gameState.player1.x -= 15 * gameState.player1.facing;
                    proj.active = false;
                    gameState.hitstopFrames = 3;
                }
            }

            // Ice wall collision detection
            for (let wall of iceWalls) {
                const wallBounds = wall.getBounds();
                if (checkAABBCollision(wallBounds, gameState.player2.hurtbox)) {
                    gameState.player2.hp = Math.max(0, gameState.player2.hp - 10);
                    gameState.player2.x = wall.x + 40;
                }
                if (checkAABBCollision(wallBounds, gameState.player1.hurtbox)) {
                    gameState.player1.hp = Math.max(0, gameState.player1.hp - 10);
                    gameState.player1.x = wall.x - 40;
                }
            }

            // Collision detection for melee attacks
            if (gameState.player1.hitbox && checkAABBCollision(gameState.player1.hitbox, gameState.player2.hurtbox)) {
                const damage = gameState.player1.action === 'punch' ? 8 : gameState.player1.action === 'kick' ? 12 : 19;
                gameState.player2.hp = Math.max(0, gameState.player2.hp - damage);
                gameState.player2.action = 'hurt';
                gameState.player2.actionFrame = 0;
                gameState.player2.x -= 20 * gameState.player2.facing;
                gameState.hitstopFrames = 5;
            }
            if (gameState.player2.hitbox && checkAABBCollision(gameState.player2.hitbox, gameState.player1.hurtbox)) {
                const damage = gameState.player2.action === 'punch' ? 8 : gameState.player2.action === 'kick' ? 12 : 19;
                gameState.player1.hp = Math.max(0, gameState.player1.hp - damage);
                gameState.player1.action = 'hurt';
                gameState.player1.actionFrame = 0;
                gameState.player1.x -= 20 * gameState.player1.facing;
                gameState.hitstopFrames = 5;
            }

            // Win conditions
            if (gameState.player1.hp <= 0) {
                gameState.player2.wins++;
                if (gameState.player2.wins >= 2) {
                    gameState.screen = 'victory';
                } else {
                    gameState.currentRound++;
                    gameState.player1.hp = 100;
                    gameState.player2.hp = 100;
                    gameState.player1.poisoned = false;
                    gameState.player2.poisoned = false;
                    gameState.frameCount = 0;
                    projectiles = [];
                    effects = [];
                    iceWalls = [];
                }
            } else if (gameState.player2.hp <= 0) {
                gameState.player1.wins++;
                if (gameState.player1.wins >= 2) {
                    gameState.screen = 'victory';
                } else {
                    gameState.currentRound++;
                    gameState.player1.hp = 100;
                    gameState.player2.hp = 100;
                    gameState.player1.poisoned = false;
                    gameState.player2.poisoned = false;
                    gameState.frameCount = 0;
                    projectiles = [];
                    effects = [];
                    iceWalls = [];
                }
            }
        }

        function updateVictoryScreen() {
            if (keys['enter']) {
                gameState.screen = 'title';
                gameState.frameCount = 0;
                gameState.player1.wins = 0;
                gameState.player2.wins = 0;
                gameState.currentRound = 1;
                gameState.player1.specialCooldown = 0;
                gameState.player2.specialCooldown = 0;
                gameState.player1.poisoned = false;
                gameState.player2.poisoned = false;
                projectiles = [];
                effects = [];
                iceWalls = [];
                keys['enter'] = false;
            }
        }

        // ============================================================================
        // MAIN GAME LOOP
        // ============================================================================

        function gameLoop() {
            // Render
            if (gameState.screen === 'title') {
                drawTitleScreen();
            } else if (gameState.screen === 'characterSelect') {
                drawCharacterSelectScreen();
                updateCharacterSelectScreen();
            } else if (gameState.screen === 'stageSelect') {
                drawStageSelectScreen();
                updateStageSelectScreen();
            } else if (gameState.screen === 'battle') {
                drawBattleScreen();
                updateBattleScreen();
            } else if (gameState.screen === 'victory') {
                drawVictoryScreen();
                updateVictoryScreen();
            }

            gameState.frameCount++;
            requestAnimationFrame(gameLoop);
        }

        // ============================================================================
        // START
        // ============================================================================

        gameLoop();
    </script>
</body>
</html>
