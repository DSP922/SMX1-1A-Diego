<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏎️ F1 Kart: El Desafío (Concepto Web)</title>
    <style>
        /* --- ESTILOS CSS --- */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        #game-container {
            width: 1000px;
            height: 700px;
            background-color: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- MENÚ VISUALMENTE ATRACTIVO --- */
        #main-menu {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); /* Azul Oscuro Degradado */
            color: white;
            padding: 40px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #main-menu h1 {
            font-size: 4em;
            margin-bottom: 0.5em;
            text-shadow: 3px 3px 5px rgba(0, 0, 0, 0.5);
        }

        .menu-button {
            background-color: #ff5722; /* Naranja Vibrante */
            color: white;
            border: none;
            padding: 15px 40px;
            margin: 10px;
            font-size: 1.5em;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            box-shadow: 0 4px #c43800;
        }

        .menu-button:hover {
            background-color: #e64a19;
            transform: translateY(-2px);
            box-shadow: 0 6px #c43800;
        }

        .menu-button:active {
            transform: translateY(2px);
            box-shadow: 0 2px #c43800;
        }

        /* --- SELECCIÓN DE OPCIONES --- */
        #selection-screen {
            background-color: #eee;
            padding: 20px;
            text-align: center;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            flex-grow: 1;
        }

        #color-selector, #map-selector, #difficulty-selector {
            margin-bottom: 25px;
        }

        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: inline-block;
            margin: 5px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: border-color 0.2s;
        }

        .color-option.selected {
            border-color: #ff5722;
            transform: scale(1.1);
        }
        
        .map-card {
            background-color: #fff;
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
            display: inline-block;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: box-shadow 0.2s;
            border: 3px solid transparent;
        }

        .map-card.selected {
            border-color: #2a5298;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        /* Estilo para los botones de dificultad */
        .difficulty-button {
            background-color: #666;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .difficulty-button.selected {
            background-color: #4CAF50; /* Verde para seleccionado */
            box-shadow: 0 3px #388E3C;
        }

        /* --- PANTALLA DE JUEGO --- */
        #game-screen {
            display: none;
            flex-direction: column;
            flex-grow: 1;
        }

        #game-canvas {
            background-color: #b4e0b4; /* Césped Pastel */
            flex-grow: 1;
        }
        
        #hud {
            padding: 10px;
            background-color: #222;
            color: white;
            font-size: 1.1em;
            display: flex;
            justify-content: space-around;
        }

        /* --- UTILS --- */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="main-menu">
        <h1>🏎️ F1 KART CHALLENGE</h1>
        <button class="menu-button" onclick="showSelectionScreen()">JUGAR</button>
        <button class="menu-button" id="difficulty-display" onclick="showSelectionScreen()">DIFICULTAD: NORMAL</button>
        <button class="menu-button" onclick="alert('¡Gracias por jugar! Puedes cerrar esta ventana.');">SALIR</button>
    </div>

            <button class="difficulty-button" data-difficulty="Dificil" onclick="selectDifficulty('Dificil')">Difícil</button>
