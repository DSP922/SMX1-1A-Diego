<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Grand Prix - Carrera Simple</title>
    <style>
        /* CSS: Estilos Generales y Visuales */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            background-color: #0d1117; /* Fondo oscuro tipo asfalto */
            color: #fff;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5); /* Resplandor neón */
            border-radius: 10px;
            overflow: hidden;
        }

        /* Lienzo del juego - Aquí se dibujará la pista y los coches */
        #gameCanvas {
            border: 5px solid #ffcc00; /* Borde amarillo F1 */
            background-color: #2c3e50; /* Color base de la pista */
        }

        /* Estilo del menú inicial */
        #startMenu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #startMenu h1 {
            color: #ffcc00;
            text-shadow: 0 0 10px #ffcc00;
            font-size: 3em;
            margin-bottom: 20px;
        }

        #startMenu button {
            background-color: #e74c3c; /* Rojo intenso */
            color: white;
            border: none;
            padding: 15px 30px;
            margin: 10px;
            font-size: 1.2em;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color 0.3s, transform 0.1s;
        }

        #startMenu button:hover {
            background-color: #c0392b;
            transform: scale(1.05);
        }

        /* Estilo de la tabla clasificatoria (Fin del juego) */
        #resultsTable {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #resultsTable h2 {
            color: #ffcc00;
            text-shadow: 0 0 10px #ffcc00;
            font-size: 2.5em;
            margin-bottom: 30px;
        }

        #resultsTable table {
            width: 80%;
            max-width: 600px;
            border-collapse: collapse;
            background-color: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
        }

        #resultsTable th, #resultsTable td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        #resultsTable th {
            background-color: #e74c3c;
            color: white;
            font-size: 1.1em;
        }

        #resultsTable tr:nth-child(even) {
            background-color: #2c3e50;
        }
        
        #resultsTable tr.player-row {
            background-color: #27ae60 !important; /* Destacar al jugador */
            font-weight: bold;
        }
        
        /* HUD - Información de la carrera */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 5px;
            color: white;
            font-size: 1.2em;
            z-index: 5;
        }

    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div id="hud">
            Vueltas: <span id="laps">0/5</span> | Tiempo: <span id="time">00:00.00</span>
        </div>

        <div id="startMenu">
            <h1>F1 SIMPLE RACER</h1>
            <h2>Selecciona Dificultad</h2>
            <button onclick="startGame(50)">FÁCIL (50 km/h)</button>
            <button onclick="startGame(100)">NORMAL (100 km/h)</button>
            <button onclick="startGame(150)">DIFÍCIL (150 km/h)</button>
        </div>

        <div id="resultsTable">
            <h2>🏆 Resultados Finales 🏁</h2>
            <table>
                <thead>
                    <tr>
                        <th>Posición</th>
                        <th>Piloto</th>
                        <th>Tiempo Total</th>
                    </tr>
                </thead>
                <tbody id="resultsBody">
                    </tbody>
            </table>
            <button onclick="window.location.reload()">Jugar de Nuevo</button>
        </div>
    </div>

    <script>
        // JAVASCRIPT: Lógica del Juego
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;

        let gameLoopId;
        let gameActive = false;
        let startTime = 0;
        let difficultySpeed = 0; // Velocidad base de los bots
        const MAX_LAPS = 5;

        // --- Configuración de Colores ---
        const ALL_COLORS = [
            '#ff0000', '#0000ff', '#00ff00', '#ffff00', '#ff00ff', 
            '#00ffff', '#ffa500', '#800080', '#008000', '#ffc0cb'
        ];
        
        const PLAYER_COLOR = '#ffcc00'; // Color del jugador (Amarillo F1)

        /**
         * @typedef {Object} Car
         * @property {number} x - Posición X
         * @property {number} y - Posición Y
         * @property {number} dx - Velocidad en X
         * @property {number} dy - Velocidad en Y
         * @property {number} angle - Ángulo de dirección (en radianes)
         * @property {number} speed - Velocidad actual
         * @property {string} color - Color del coche
         * @property {string} name - Nombre del piloto
         * @property {number} laps - Vueltas completadas
         * @property {number} totalTime - Tiempo final de carrera
         */

        /** @type {Car} */
        let player = {
            x: 50, y: H / 2, dx: 0, dy: 0, angle: 0, speed: 0, 
            color: PLAYER_COLOR, name: "JUGADOR", laps: 0, totalTime: 0
        };

        /** @type {Car[]} */
        let cars = [player];

        // --- Generar Bots (Simplificado a 1 Bot por ahora) ---
        function createBots(numBots, speedBase) {
            let availableColors = ALL_COLORS.filter(c => c !== PLAYER_COLOR);
            cars = [player]; // Reiniciar con solo el jugador

            for (let i = 0; i < numBots; i++) {
                // Asignar color aleatorio y único
                const colorIndex = Math.floor(Math.random() * availableColors.length);
                const botColor = availableColors.splice(colorIndex, 1)[0];

                // Crear Bot. Su velocidad será una variación de la dificultad
                const botSpeed = speedBase * (0.9 + Math.random() * 0.2); // +/- 10%
                
                cars.push({
                    x: 50, y: H / 2 - (i + 1) * 30, dx: 0, dy: 0, angle: 0, speed: botSpeed, 
                    color: botColor, name: `BOT ${i + 1}`, laps: 0, totalTime: 0
                });
            }
        }
        
        // --- Constantes de Juego ---
        const CAR_WIDTH = 25;
        const CAR_HEIGHT = 15;
        const ACCELERATION = 0.5;
        const DRAG = 0.98;
        const MAX_PLAYER_SPEED = 5;
        const TURN_SPEED = 0.05;

        // --- Mapa (Muros Simples) ---
        // Definir la "pista" como un área central
        const TRACK_MARGIN = 50; // Margen para los muros

        // --- Controles de Teclado ---
        let keys = {};
        window.addEventListener('keydown', (e) => { keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        // --- Funciones de Dibujo ---

        // Dibuja la pista y la meta
        function drawTrack() {
            // Muros (líneas exteriores)
            ctx.strokeStyle = '#555';
            ctx.lineWidth = TRACK_MARGIN;
            ctx.strokeRect(TRACK_MARGIN / 2, TRACK_MARGIN / 2, W - TRACK_MARGIN, H - TRACK_MARGIN);

            // Asfalto
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(TRACK_MARGIN, TRACK_MARGIN, W - 2 * TRACK_MARGIN, H - 2 * TRACK_MARGIN);

            // Línea central (opcional)
            // ctx.strokeStyle = 'white';
            // ctx.setLineDash([10, 10]);
            // ctx.strokeRect(TRACK_MARGIN, TRACK_MARGIN, W - 2 * TRACK_MARGIN, H - 2 * TRACK_MARGIN);
            // ctx.setLineDash([]); // Reset dash

            // Meta (Estilo F1) - Se coloca cerca del inicio
            const finishLineX = TRACK_MARGIN;
            const finishLineY = H / 2 - 20;
            const finishLineW = 5;
            const finishLineH = 40;

            // Patrón a cuadros blanco y negro
            for (let i = 0; i < finishLineH / 10; i++) {
                ctx.fillStyle = (i % 2 === 0) ? 'black' : 'white';
                ctx.fillRect(finishLineX, finishLineY + i * 10, finishLineW, 10);
                
                ctx.fillStyle = (i % 2 !== 0) ? 'black' : 'white';
                ctx.fillRect(finishLineX + 5, finishLineY + i * 10, finishLineW, 10);
            }
            ctx.fillStyle = 'red';
            ctx.fillRect(finishLineX - 5, finishLineY - 5, finishLineW + 15, 5); // Borde superior

        }

        // Dibuja un coche
        function drawCar(car) {
            ctx.save();
            // Mover y rotar el contexto al centro del coche
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);
            
            // Cuerpo del coche (F1 simplificado)
            ctx.fillStyle = car.color;
            ctx.fillRect(-CAR_WIDTH / 2, -CAR_HEIGHT / 2, CAR_WIDTH, CAR_HEIGHT);

            // Ruedas (pequeños rectángulos negros)
            ctx.fillStyle = 'black';
            ctx.fillRect(-CAR_WIDTH / 2 - 2, -CAR_HEIGHT / 2 - 3, 5, 3); // Izq superior
            ctx.fillRect(-CAR_WIDTH / 2 - 2, CAR_HEIGHT / 2, 5, 3); // Izq inferior
            ctx.fillRect(CAR_WIDTH / 2 - 3, -CAR_HEIGHT / 2 - 3, 5, 3); // Der superior
            ctx.fillRect(CAR_WIDTH / 2 - 3, CAR_HEIGHT / 2, 5, 3); // Der inferior

            // Cabina/Halo (detalles)
            ctx.fillStyle = 'white';
            ctx.fillRect(0, -2, 5, 4);

            ctx.restore();
        }

        // --- Lógica del Juego ---

        // Actualiza el estado del jugador
        function updatePlayer() {
            // 1. Controles (Acelerar/Frenar/Girar)
            if (keys['ArrowUp'] || keys['KeyW']) {
                player.speed += ACCELERATION;
            } else if (keys['ArrowDown'] || keys['KeyS']) {
                player.speed -= ACCELERATION;
            } else {
                player.speed *= DRAG; // Resistencia
            }

            // Limitar velocidad
            player.speed = Math.min(Math.max(player.speed, -MAX_PLAYER_SPEED / 2), MAX_PLAYER_SPEED);

            // Girar solo si se está moviendo
            if (Math.abs(player.speed) > 0.1) {
                if (keys['ArrowLeft'] || keys['KeyA']) {
                    player.angle -= TURN_SPEED * (player.speed > 0 ? 1 : -1);
                }
                if (keys['ArrowRight'] || keys['KeyD']) {
                    player.angle += TURN_SPEED * (player.speed > 0 ? 1 : -1);
                }
            }

            // 2. Movimiento
            player.dx = Math.cos(player.angle) * player.speed;
            player.dy = Math.sin(player.angle) * player.speed;

            player.x += player.dx;
            player.y += player.dy;

            // 3. Colisiones (Muros)
            // Lógica simple: Si toca el muro, lo detiene y lo empuja ligeramente hacia adentro.
            if (player.x < TRACK_MARGIN || player.x > W - TRACK_MARGIN || player.y < TRACK_MARGIN || player.y > H - TRACK_MARGIN) {
                // Colisión detectada: Detener y retroceder
                player.x -= player.dx;
                player.y -= player.dy;
                player.speed = -player.speed * 0.5; // Rebote suave y pérdida de velocidad
                
                // Asegurar que esté dentro de los límites (para evitar que se atasque)
                player.x = Math.min(Math.max(player.x, TRACK_MARGIN), W - TRACK_MARGIN);
                player.y = Math.min(Math.max(player.y, TRACK_MARGIN), H - TRACK_MARGIN);
            }
            
            // 4. Chequeo de Meta/Vueltas (Solo para el jugador por simplicidad)
            const finishLineX = TRACK_MARGIN;
            const finishLineYMin = H / 2 - 20;
            const finishLineYMax = H / 2 + 20;
            
            // Chequeo de cruce de meta
            if (player.x < finishLineX + 10 && player.x > finishLineX - 10 &&
                player.y > finishLineYMin && player.y < finishLineYMax) {
                
                // Evitar que cuente múltiples vueltas por frame
                if (player.laps < MAX_LAPS && (player.y > finishLineYMin && player.y < finishLineYMax)) {
                     player.laps++;
                     document.getElementById('laps').textContent = `${player.laps}/${MAX_LAPS}`;
                     console.log(`Vuelta completada: ${player.laps}`);

                     if (player.laps === MAX_LAPS) {
                         endGame();
                     }
                }
            }
        }
        
        // IA simple del Bot (Solo avanza)
        function updateBot(bot) {
             // El bot simplemente avanza a su velocidad base.
             // Una IA completa de seguimiento de pista es compleja y requiere un algoritmo de Pathfinding.
             
             // 1. Movimiento constante
             const botSpeed = bot.speed / 15; // Ajuste para el ciclo de animación

             bot.dx = Math.cos(bot.angle) * botSpeed;
             bot.dy = Math.sin(bot.angle) * botSpeed;

             bot.x += bot.dx;
             bot.y += bot.dy;
             
             // 2. IA de giro simple (Intenta mantenerse cerca del centro Y)
             if (bot.y < H / 2 - 100) {
                 bot.angle += 0.01; // Gira hacia abajo
             } else if (bot.y > H / 2 + 100) {
                 bot.angle -= 0.01; // Gira hacia arriba
             } else {
                 // Pequeña variación para simular "conducción"
                 bot.angle += (Math.random() - 0.5) * 0.005;
             }

             // 3. Chequeo de Meta
             // Se simula que el bot completa las vueltas al mismo tiempo que el jugador, 
             // o un poco más tarde, para que haya una clasificación.
             if (bot.laps < MAX_LAPS && player.laps > bot.laps) {
                 bot.laps = player.laps;
                 if (bot.laps === MAX_LAPS) {
                     bot.totalTime = player.totalTime + Math.random() * 5000 + 1000; // Un poco más tarde que el jugador
                 }
             }

             // 4. Colisiones (Muros)
             if (bot.x < TRACK_MARGIN || bot.x > W - TRACK_MARGIN || bot.y < TRACK_MARGIN || bot.y > H - TRACK_MARGIN) {
                 // Simple rebote
                 bot.x -= bot.dx;
                 bot.y -= bot.dy;
                 bot.angle += Math.PI / 2; // Gira 90 grados
             }
        }

        // Bucle Principal del Juego
        function gameLoop(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;
            
            if (gameActive) {
                // Borrar el canvas
                ctx.clearRect(0, 0, W, H);

                // Dibujar elementos estáticos
                drawTrack();

                // Actualizar y dibujar coches
                updatePlayer();
                cars.filter(car => car !== player).forEach(updateBot);

                cars.forEach(drawCar);

                // Actualizar HUD
                const totalSeconds = Math.floor(elapsed / 1000);
                const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
                const seconds = String(totalSeconds % 60).padStart(2, '0');
                const ms = String(elapsed % 1000).padStart(3, '0').substring(0, 2);
                document.getElementById('time').textContent = `${minutes}:${seconds}.${ms}`;

                gameLoopId = requestAnimationFrame(gameLoop);
            }
        }

        // --- Gestión de la Carrera ---

        function startGame(speed) {
            difficultySpeed = speed;
            document.getElementById('startMenu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';

            // Generar 9 bots (o el número deseado)
            createBots(9, speed); 
            
            // Posicionar los coches en la línea de salida
            cars.forEach((car, index) => {
                 car.x = TRACK_MARGIN + 10;
                 car.y = H / 2 - (4 * 30) + (index * 30); // Posición escalonada
                 car.angle = 0; // Mirando a la derecha
                 car.laps = 0;
                 car.totalTime = 0;
                 if (car === player) {
                    car.speed = 0;
                 }
            });
            
            gameActive = true;
            startTime = 0;
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameActive = false;
            cancelAnimationFrame(gameLoopId);
            
            // Asignar el tiempo final del jugador
            player.totalTime = performance.now() - startTime;
            
            // Para fines de demostración, asignamos tiempos a los bots que no han terminado
            cars.forEach(car => {
                if (car.totalTime === 0) {
                     car.totalTime = player.totalTime + (Math.random() * 10000 + 1000);
                }
            });

            // 1. Ordenar la tabla
            const finalResults = cars.sort((a, b) => a.totalTime - b.totalTime);

            // 2. Llenar la tabla de resultados
            const resultsBody = document.getElementById('resultsBody');
            resultsBody.innerHTML = ''; // Limpiar
            
            finalResults.forEach((car, index) => {
                const tr = document.createElement('tr');
                if (car === player) {
                    tr.classList.add('player-row');
                }
                
                const timeStr = formatTime(car.totalTime);
                
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${car.name}</td>
                    <td>${timeStr}</td>
                `;
                resultsBody.appendChild(tr);
            });

            // 3. Mostrar la tabla
            document.getElementById('resultsTable').style.display = 'flex';
        }

        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
            const seconds = String(totalSeconds % 60).padStart(2, '0');
            const milliseconds = String(Math.floor(ms % 1000)).padStart(3, '0').substring(0, 2);
            return `${minutes}:${seconds}.${milliseconds}`;
        }
        
        // Inicialización: Ocultar HUD y mostrar menú
        document.getElementById('hud').style.display = 'none';

    </script>
</body>
</html>
