<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini-Race: Karts HTML</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; font-family:sans-serif; }
  canvas { display:block; background:#bde8c8; }
  #menu {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:600px; max-width:90%; background:linear-gradient(#bfdff8,#cfe8ff);
    border-radius:16px; padding:20px; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,0.2);
  }
  .btn { margin:10px; padding:10px 20px; border:none; border-radius:10px; background:#fff; cursor:pointer; font-weight:bold; }
  #hud { position:absolute; left:12px; top:12px; color:#06324a; background:rgba(255,255,255,0.8); padding:8px 12px; border-radius:10px; font-weight:600; display:none; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="menu">
  <h1>Mini-Race: Karts</h1>
  <button id="playBtn" class="btn">Jugar</button>
</div>

<div id="hud">Vuelta: 0 | Pos: 1/10</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;
window.addEventListener('resize', ()=>{ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; });

const input = { left:false, right:false, up:false, down:false };
window.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft'||e.key==='a') input.left=true;
  if(e.key==='ArrowRight'||e.key==='d') input.right=true;
  if(e.key==='ArrowUp'||e.key==='w') input.up=true;
  if(e.key==='ArrowDown'||e.key==='s') input.down=true;
});
window.addEventListener('keyup', e=>{
  if(e.key==='ArrowLeft'||e.key==='a') input.left=false;
  if(e.key==='ArrowRight'||e.key==='d') input.right=false;
  if(e.key==='ArrowUp'||e.key==='w') input.up=false;
  if(e.key==='ArrowDown'||e.key==='s') input.down=false;
});

// --- TRACK SIMPLE (ÓVALO) ---
const track = [];
for(let i=0;i<360;i+=2){
  const angle = i * Math.PI/180;
  track.push({x: Math.cos(angle)*400, y: Math.sin(angle)*200});
}

// --- CAR ---
class Car {
  constructor(x,y,color,isPlayer=false){
    this.pos={x,y}; this.angle=0; this.speed=0; this.color=color; this.isPlayer=isPlayer;
  }
  update(){
    if(this.isPlayer){
      if(input.up) this.speed+=0.1;
      if(input.down) this.speed-=0.1;
      if(input.left) this.angle-=0.04;
      if(input.right) this.angle+=0.04;
      this.speed*=0.98;
      this.pos.x+=Math.cos(this.angle)*this.speed;
      this.pos.y+=Math.sin(this.angle)*this.speed;
    }
  }
  draw(ctx,cam){
    const x=this.pos.x-cam.x+W/2;
    const y=this.pos.y-cam.y+H/2;
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(this.angle);
    ctx.fillStyle=this.color;
    ctx.fillRect(-15,-10,30,20);
    ctx.restore();
  }
}

// --- JUEGO ---
let player;
let npcs=[];
let running=false;
let cam={x:0,y:0};

function startGame(){
  document.getElementById('menu').style.display='none';
  document.getElementById('hud').style.display='block';
  player=new Car(track[0].x, track[0].y, 'red', true);
  npcs=[];
  for(let i=0;i<5;i++){
    npcs.push(new Car(track[0].x+Math.random()*50, track[0].y+Math.random()*50, 'blue'));
  }
  running=true;
  requestAnimationFrame(loop);
}

// --- LOOP ---
function loop(){
  if(!running) return;
  ctx.clearRect(0,0,W,H);
  
  // CAMARA
  cam.x=player.pos.x;
  cam.y=player.pos.y;

  // DIBUJAR PISTA
  ctx.strokeStyle='gray';
  ctx.lineWidth=60;
  ctx.beginPath();
  for(let i=0;i<track.length;i++){
    const p=track[i];
    const x=p.x-cam.x+W/2, y=p.y-cam.y+H/2;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.stroke();

  // ACTUALIZAR Y DIBUJAR CARS
  player.update();
  player.draw(ctx,cam);
  for(let npc of npcs){ npc.update(); npc.draw(ctx,cam); }

  requestAnimationFrame(loop);
}

// --- BOTÓN ---
document.getElementById('playBtn').addEventListener('click', startGame);
</script>
</body>
</html>
