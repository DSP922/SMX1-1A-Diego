<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini-Race: Karts</title>
<style>
html,body { margin:0; padding:0; overflow:hidden; background:#bde8c8; font-family:sans-serif; }
canvas { display:block; background:#bde8c8; }
/* MENU */
#menu {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:760px; max-width:95%; background:linear-gradient(#bfdff8,#cfe8ff);
  border-radius:16px; padding:24px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.2);
}
#menu h1 { margin:6px 0 12px; font-size:28px; color:#033a6b; }
.controls { display:flex; gap:12px; justify-content:center; align-items:center; margin:12px 0 18px; flex-wrap:wrap; }
.btn { margin:10px; padding:10px 20px; border:none; border-radius:10px; background:#fff; cursor:pointer; font-weight:bold; transition:0.2s; }
.btn:hover { transform:scale(1.05); }
.swatch { width:36px; height:36px; border-radius:6px; border:3px solid rgba(255,255,255,0.6); cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,0.15); transition:0.2s; }
.swatch.selected { outline:3px solid rgba(0,0,0,0.25); transform:scale(1.1); }
.difficulty { padding:6px 10px; border-radius:6px; border:1px solid rgba(0,0,0,0.08); background:#fff; }
#hud { position:absolute; left:12px; top:12px; color:#06324a; background:rgba(255,255,255,0.8); padding:8px 12px; border-radius:10px; font-weight:600; display:none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="menu">
  <h1>Mini-Race: Karts</h1>
  <div style="font-size:14px;color:#04385a;margin-bottom:8px;">Elige circuito, color, dificultad y pulsa Jugar</div>
  <div class="controls">
    <div>
      <label style="display:block;font-weight:700;color:#033a6b;margin-bottom:6px">Circuito</label>
      <select id="trackSelect" class="difficulty">
        <option value="0">Circuito 1 — Óvalo</option>
        <option value="1">Circuito 2 — Montaña</option>
        <option value="2">Circuito 3 — Ciudad</option>
        <option value="3">Circuito 4 — Laberinto</option>
      </select>
    </div>
    <div>
      <label style="display:block;font-weight:700;color:#033a6b;margin-bottom:6px">Dificultad</label>
      <select id="difficulty" class="difficulty">
        <option value="0">Fácil</option>
        <option value="1" selected>Normal</option>
        <option value="2">Difícil</option>
      </select>
    </div>
    <div style="min-width:220px">
      <label style="display:block;font-weight:700;color:#033a6b;margin-bottom:6px">Color del jugador</label>
      <div id="colorChoices" class="controls"></div>
    </div>
  </div>
  <button id="playBtn" class="btn">Jugar</button>
</div>

<div id="hud">Vuelta: 0 | Pos: 1/10</div>

<script>
// ---------------- Config ----------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W=canvas.width=window.innerWidth, H=canvas.height=window.innerHeight;
window.addEventListener('resize',()=>{ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; });

let input={left:false,right:false,up:false,down:false};
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a') input.left=true;
  if(e.key==='ArrowRight'||e.key==='d') input.right=true;
  if(e.key==='ArrowUp'||e.key==='w') input.up=true;
  if(e.key==='ArrowDown'||e.key==='s') input.down=true;
});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a') input.left=false;
  if(e.key==='ArrowRight'||e.key==='d') input.right=false;
  if(e.key==='ArrowUp'||e.key==='w') input.up=false;
  if(e.key==='ArrowDown'||e.key==='s') input.down=false;
});

// Variables globales
const COLORS=['#FF4B4B','#FF9A3C','#FFD166','#6EE7B7','#4CC9F0','#7C83FD','#E56ED1','#A3D39C','#FFB1C1','#C9F1FF'];
const TOTAL_CARS=10;
let state={
  running:false,
  trackIndex:0,
  difficulty:1,
  playerColor:COLORS[0],
  cars:[],
  track:null,
  camera:{x:0,y:0}
};

// ---------------- Menú ----------------
const menu = document.getElementById('menu');
const trackSelect = document.getElementById('trackSelect');
const difficultySelect = document.getElementById('difficulty');
const colorChoices = document.getElementById('colorChoices');
const playBtn = document.getElementById('playBtn');
const hud = document.getElementById('hud');

// Selector de colores
let selectedColor = COLORS[0];
COLORS.forEach(c=>{
  const sw = document.createElement('div'); sw.className='swatch'; sw.style.background=c;
  if(c===selectedColor) sw.classList.add('selected');
  sw.addEventListener('click',()=>{ document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('selected')); sw.classList.add('selected'); selectedColor=c; });
  colorChoices.appendChild(sw);
});

playBtn.onclick=()=>{
  state.trackIndex=parseInt(trackSelect.value);
  state.difficulty=parseInt(difficultySelect.value);
  state.playerColor=selectedColor;
  resetGame();
  menu.style.display='none';
};

// ---------------- TRACKS ----------------
const tracks=[];
function makeOval(cx,cy,rx,ry,segments=180){
  const pts=[];
  for(let i=0;i<segments;i++){
    const a=i/segments*Math.PI*2;
    pts.push({x:cx+Math.cos(a)*rx, y:cy+Math.sin(a)*ry});
  }
  return pts;
}
(function createTracks(){
  tracks.push({centerline:makeOval(0,0,1200,700,240),startPos:{x:0,y:-60,angle:-Math.PI/2}});
  const pts1=[]; for(let i=0;i<420;i++){ const t=i/420; pts1.push({x:-1600+t*3200, y:Math.sin(t*4*Math.PI)*600+Math.cos(t*2*Math.PI)*200}); }
  tracks.push({centerline:pts1,startPos:{x:pts1[0].x,y:pts1[0].y-100,angle:-Math.PI/2}});
  const pts2=[]; const R=1400; for(let i=0;i<360;i++){ const a=i*2*Math.PI/360; const r=R+250*Math.sin(a*4)+120*Math.cos(a*7); pts2.push({x:Math.cos(a)*r, y:Math.sin(a)*r}); }
  tracks.push({centerline:pts2,startPos:{x:pts2[10].x,y:pts2[10].y-80,angle:0}});
  const pts3=[]; const scale=900; for(let i=0;i<600;i++){ const t=i/600; const a=t*6*Math.PI; pts3.push({x:Math.cos(a)*(scale*(0.8+0.2*Math.sin(a*3))), y:Math.sin(a)*(scale*(0.8+0.2*Math.cos(a*2)))}); }
  tracks.push({centerline:pts3,startPos:{x:pts3[0].x,y:pts3[0].y-100,angle:Math.PI/2}});
})();

// ---------------- ENTIDADES ----------------
class Car{
  constructor(id,x,y,angle,color,isPlayer=false){
    this.id=id; this.pos={x,y}; this.angle=angle; this.speed=0; this.color=color; this.isPlayer=isPlayer;
    this.size=18; this.steering=0; this.throttle=0; this.maxSpeed=4;
    this.currentWaypoint=0; this.laps=0; this.rank=1;
  }
  update(dt){
    if(this.isPlayer){
      const steerFactor=Math.max(0.05,Math.min(1,this.speed/this.maxSpeed));
      this.angle += this.steering*0.045*steerFactor*dt*60;
      this.speed += (this.throttle>0?0.12*this.throttle:-0.06)*dt*60;
      this.speed=Math.max(-1.2,Math.min(this.maxSpeed,this.speed));
    } else { this.updateAI(dt); }
    this.pos.x+=Math.cos(this.angle)*this.speed*dt*60;
    this.pos.y+=Math.sin(this.angle)*this.speed*dt*60;
    this.speed*=0.995;
  }
  updateAI(dt){
    const line=state.track.centerline; if(!line) return;
    const wp=line[this.currentWaypoint%line.length];
    const dx=wp.x-this.pos.x, dy=wp.y-this.pos.y;
    const targetAngle=Math.atan2(dy,dx);
    let angleDiff=targetAngle-this.angle;
    while(angleDiff>Math.PI) angleDiff-=2*Math.PI;
    while(angleDiff<-Math.PI) angleDiff+=2*Math.PI;
    this.steering=Math.max(-1,Math.min(1,angleDiff*2));
    this.throttle=1-state.difficulty*0.25;
    if(Math.hypot(dx,dy)<120) this.currentWaypoint=(this.currentWaypoint+1)%line.length;
  }
  draw(ctx,camX,camY){
    const x=this.pos.x-camX+W/2, y=this.pos.y-camY+H/2;
    ctx.save(); ctx.translate(x,y); ctx.rotate(this.angle);
    ctx.fillStyle=this.color; roundRect(ctx,-22,-12,44,24,6); ctx.fill();
    ctx.restore();
  }
}
function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// ---------------- GAME ----------------
function resetGame(){
  state.cars=[]; state.track=tracks[state.trackIndex]; state.camera={x:state.track.startPos.x,y:state.track.startPos.y};
  state.cars.push(new Car('P',state.track.startPos.x,state.track.startPos.y,state.track.startPos.angle,state.playerColor,true));
  const avail=COLORS.filter(c=>c!==state.playerColor);
  for(let i=0;i<TOTAL_CARS-1;i++){ state.cars.push(new Car(i+1,state.track.startPos.x+Math.random()*50,state.track.startPos.y+Math.random()*50,state.track.startPos.angle,avail[i%avail.length])); }
  state.running=true; hud.style.display='block';
}

function updateRanking(){
  const line=state.track.centerline;
  state.cars.forEach(c=>{
    let bestIdx=0,bestD=Infinity;
    for(let i=0;i<line.length;i+=4){
      const d=Math.hypot(c.pos.x-line[i].x,c.pos.y-line[i].y);
      if(d<bestD){ bestD=d; bestIdx=i; }
    }
    c._progress=c.laps*line.length+bestIdx;
  });
  state.cars.sort((a,b)=>b._progress-a._progress);
  state.cars.forEach((c,i)=>c.rank=i+1);
  hud.innerText=`Vuelta: ${state.cars[0].laps} | Pos: ${state.cars[0].rank}/${state.cars.length}`;
}

// ---------------- LOOP ----------------
let lastTime=performance.now();
function loop(t){
  const dt=Math.min(0.033,(t-lastTime)/1000); lastTime=t;
  if(state.running) update(dt);
  render();
  requestAnimationFrame(loop);
}
function update(dt){
  const player=state.cars[0]; player.steering=0; if(input.left) player.steering=-1; if(input.right) player.steering=1; player.throttle=0; if(input.up) player.throttle=1; if(input.down) player.throttle=-0.5;
  state.cars.forEach(c=>c.update(dt));
  state.camera.x+=(player.pos.x-state.camera.x)*0.12;
  state.camera.y+=(player.pos.y-state.camera.y)*0.12;
  updateRanking();
}
function render(){
  ctx.clearRect(0,0,W,H);
  const camX=state.camera.x, camY=state.camera.y;
  const line=state.track.centerline;
  ctx.save(); ctx.translate(W/2-camX,H/2-camY);
  ctx.lineWidth=220; ctx.strokeStyle='#4b4b4b'; ctx.beginPath();
  ctx.moveTo(line[0].x,line[0].y); for(let i=1;i<line.length;i++) ctx.lineTo(line[i].x,line[i].y); ctx.closePath(); ctx.stroke();
  ctx.lineWidth=4; ctx.setLineDash([24,18]); ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.moveTo(line[0].x,line[0].y); for(let i=1;i<line.length;i++) ctx.lineTo(line[i].x,line[i].y); ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();
  state.cars.forEach(c=>c.draw(ctx,camX,camY));
}
requestAnimationFrame(loop);
</script>
</body>
</html>
